ciclo_6_construcao_2026_08_16:
  aviso: >-
    ESTADO VIVO. As seções anteriores refletem ciclos 0-5. O ciclo 6 é o
    PRIMEIRO ciclo de construção de software: existe código executável no
    repositório pela primeira vez.
  branch_atual: cycle-6/construcao-g7 (a partir de cycle-5/execucao-agentificada @ a6e7c0c)
  relatorio: docs/15-release-evidence/cycle-6-construction-report.md  # leitura obrigatória na retomada
  decisao_nova_do_titular: >-
    GDEC-0017 (2026-08-16): construção integral desbloqueada; autonomia
    decisória delegada ao orquestrador, com decisões materiais registradas
    como premissas reversíveis de uma linha. Vinculantes seguem apenas os
    três de GDEC-0014 (CI de conteúdo proibido/PHI + convenções, PR para
    main, dados sintéticos como default). Próximo GDEC livre: GDEC-0018.
  regime_vigente: >-
    MODO CONSTRUÇÃO (GDEC-0013..0017). Painel AGT-4 e as 7 condições da
    AGT-3 NÃO são vinculantes em nenhuma fase. Revisão única (revisor
    distinto do autor) é a prática adotada. Aceite formal de ADR não é
    pré-condição de implementação.
  o_que_existe_agora_de_codigo:
    monorepo: pnpm workspaces — packages/{kernel-clinico,dominio,persistencia,contratos,fixtures-sinteticas} + apps/{api,web}
    fatia_g7: >-
      Fatia vertical sintética ponta-a-ponta (SPR-G7-2, commit 87798af):
      ingestão -> avaliação NEWS2 determinística -> status explícito ->
      alerta durável + outbox na mesma transação -> projeção de grade de
      leitos -> reconhecimento com concorrência otimista -> auditoria
      append-only. Caminhos degradados demonstrados (insumo ausente
      fail-closed HAZ-0005; tenant errado; If-Match errado; replay).
    verificacao: "pnpm verify verde de ponta a ponta (exit 0) sobre 11 pacotes: typecheck, lint, fronteira de modulos, build, testes e os dois gates de docs. 1.026 testes verdes, incl. 93/93 vetores CRV-NEWS2 red/green e mutacao do kernel em 93,07%"
    dados: "100% sintéticos (SYNTH-); NENHUM dado real acessado"
  sprints_fechados_ciclo_6: [SPR-G4-1, SPR-G4-7, SPR-G6-7, SPR-G0-3-tranche-3, SPR-G0-3-tranche-4, SPR-G7-1, SPR-G4-3, "SPR-G4-4 (parcial)", SPR-G7-2, "SPR-G6-2 (parcial)", SPR-G2-3, "SPR-G3-10 (parcial)", "SPR-G5-1 (parcial)", "SPR-G8-1 (parcial)", "SPR-OC-1 (parcial)"]
  onda_4_fases_destravadas: >-
    Correção de classificação registrada em
    docs/14-devsecops-and-delivery/analise-pos-ciclo-6-mapa-vs-estado.md §3:
    partes das fases 2, 3, 5, 7, 8 e 10 do §17 eram executáveis assim que a
    fatia G7 criou runtime. Entregues: pacote de release assinável
    (packages/rule-bundle, ADR-0007, autor!=aprovador inexprimível no tipo);
    harness §7.6 executável (packages/conformidade, 22 cenários contra
    fixtures pinadas — NENHUM contra a AMH); segunda via clínica RULE-GCS
    0.2.0 no kernel (gate sedativo ADR-0028 fail-closed); instrumentação e
    runbooks (packages/observabilidade + docs/13-operations-and-reliability,
    redação de PHI como tipo); vigilância (packages/vigilancia, K-8 com as
    figuras companheiras obrigatórias por tipo).
  estados_de_fase_emendados: >-
    Mapa e backlog emendados: G2 BLOQUEADO->PARCIAL; G4, G6 e G7 NÃO
    INICIADO->PARCIAL. NENHUM gate foi aprovado — PARCIAL = camadas
    percorridas, jamais verificação ou aprovação humana.
  saidas_spark_novas: "árvore de outcomes (§5 saída 6), exclusões e capacidades adiadas (saída 15), índice priorizado de famílias (saída 7, substituto honesto do catálogo PRD/USR)"
  adrs: >-
    30 ADRs no índice. ADR-0012..ADR-0024 redigidos neste ciclo
    materializando as direções aceitas em GDEC-0016 (com as 3 modificações
    do titular: MCP mantido no MVP; frontend dono da linguagem com estado
    clínico originado no backend; IA/ML governado com conector para agentes
    clínicos). "accepted" continua não significando "implemented".
  estado_duro_INALTERADO: >-
    0 vias acionáveis; 47/47 inelegíveis; Observation AMH não consumível;
    somente candidato a integração; safety case M0; nenhum dado real
    acessado. A fatia G7 NÃO altera nenhum destes — usa fixtures sintéticas
    pinadas e não consome a AMH.
  marcos_humanos_pendentes: [MG-G1, MG-G3, MG-G4, MG-G5, MG-G6, MG-G7, MG-G8-PILOTO, MG-G8-PROD]
  fila_do_titular:
    - "PR de cycle-6/construcao-g7 para main (vinculante GDEC-0014)"
    - "MG-G7: aceitação da fatia como fundação (revisor independente da regra != autor)"
    - "Aceite formal, credencial e linha de reporte do 2º revisor clínico (GDEC-0010; BLK-0002/0008)"
    - "PDF original assinado do parecer OS-16 (SPR-G0-4)"
    - "BLK-0015: dono AMH do contrato (producer.owner)"
    - "Ratificação clínica: janela de sobreposição temporal por parâmetro (proposta em packages/kernel-clinico/README.md) e taxonomia de razões de status (reference-vectors.md §1)"
    - "Ratificação de prefixos documento-locais em traceability-policy.md §1.1 (MD/MG/EPC/SPR/SR/OC/AO)"
    - >-
      DECISÃO DE GOVERNANÇA PENDENTE — checks obrigatórios da proteção da main.
      Hoje só doc-conventions e forbidden-content são obrigatórios; o CI de
      plataforma (build-and-test: build, typecheck, lint, fronteira de módulos
      e 1.026 testes) e o gate de metadados NÃO são. Na prática isso os torna
      advisory, o que o anti-padrão 11 do próprio prompt proíbe. O orquestrador
      NÃO alterou a proteção por conta própria: GDEC-0014 enumera de forma
      exaustiva o que é vinculante ("os gates de CI existentes", e só havia
      docs-gates quando foi escrita), e como enforce_admins=true um check
      obrigatório bloqueia também o titular. Ampliar o conjunto vinculante é
      decisão dele, não de agente. Comando, se aprovar:
      gh api -X PATCH repos/Omni-Saude/intensicare-V2/branches/main/protection/required_status_checks
      -f 'contexts[]=doc-conventions' -f 'contexts[]=forbidden-content'
      -f 'contexts[]=build-and-test'  (acrescentar change-metadata se quiser o
      gate de rastreabilidade também vinculante). Reversível pelo mesmo comando
      sem o contexto extra.
  proximos_executaveis_sem_humano: ["integrar RULE-GCS + rule-bundle + observabilidade na rota da API (pacotes existem e sao testados; fiacao parcial)", "SOFA como terceira via", "AsyncAPI formal", "SPR-G0-3 tranche 5", "ampliar estados §11 no frontend", "estado de erro de UI para rejeicao de rede (gap real registrado)"]
  advertencia_de_sequencia: >-
    INFERENCE do orquestrador, ponto de decisao do titular: percorrido o
    MG-G7, a V2 deixa de ter caminho critico proprio — todo avanco de gate
    passa a depender da AMH, de terceiros ou do titular. Aprofundar
    capacidade sem gate a vista acumula trabalho que o dado real pode
    contradizer (SR-3 aplicado ao produto inteiro).

analise_de_lacunas_frontend_2026_08_18:
  aviso: >-
    ESTADO VIVO. Trabalho POSTERIOR à consolidação: a main já contém o PR
    (HEAD 7eef8c0), ao contrário do que a seção abaixo afirma sobre main
    intacta e PR aberto. Esta seção não supersede nada além disso; o estado
    factual duro segue INALTERADO.
  branch_atual: codex/lacunas-frontend-ux (a partir de main @ 7eef8c0)
  main_alterada: "NÃO — nenhum commit foi feito na main"
  encargo: >-
    Aprofundar a análise de lacunas de frontend/UI/UX sobre um relatório de
    estado, e corrigir o que fosse defeito de correção (não escopo pendente).
  produto:
    - docs/10-ux-and-accessibility/analise-de-lacunas-frontend.md (LAC-D1..D8, LAC-L1..L9)
  achado_central: >-
    Sob a honestidade declarada do frontend havia OITO defeitos de correção —
    comportamento implementado contrariando cláusula vinculante já aceita, não
    escopo pendente. Três viviam em caminhos que NENHUM teste da fatia
    percorria. Todos corrigidos com teste que falha antes e passa depois.
  medicao_antes_da_correcao: >-
    Com os testes escritos e NENHUMA correção aplicada: 13 de 14 falharam
    (188 verdes / 201 no pacote web). O 14º ("leito diferente nunca exibe o
    paciente anterior") passava VACUAMENTE, porque a tela não exibia nada
    naquele estado — ele existe para não regredir depois da correção de D4.
  defeitos_corrigidos:
    D1: >-
      P0. If-Match carregava a versão CORRENTE (relida no envio), não a versão
      VISTA. Efeito: 412 inalcançável pela UI, última-escrita-vence silenciosa
      de volta (ADR-0009 W3; HAZ-0023), AuditEvidence de W6 gravando versão que
      ninguém viu, e `?? 0` fabricando If-Match sobre recurso desconhecido.
      Corrigido: versaoVista obrigatória na porta (omissão = erro de
      compilação), releitura removida, 428 em vez de valor fabricado, dublê
      passou a PRODUZIR 412, e fase `conflito` própria sem "tentar novamente".
    D2: >-
      P0. motivos/anotacoes/explicacao/parametroVermelho descartados no
      mapeamento — e no lugar das razões codificadas do backend a tela exibia
      parágrafo REDIGIDO PELO FRONTEND, no estado fail-closed (ADR-0008 N3;
      ADR-0021 F3/F8; ADR-0026 INV-B).
    D3: >-
      P0. `mapearBanda(...) ?? "alto"` fabricava severidade que o backend
      recusou a emitir, tornando item sem avaliação computável indistinguível
      de item grave (ADR-0011 P7; QAS-0017 exige contagem zero).
    D4: >-
      P1. Detalhe perdia todo o conteúdo na recarga que falha enquanto o rótulo
      afirmava exibi-lo. A correção precisou de GUARDA DE IDENTIDADE: preservar
      dado desatualizado atravessando leitos seria HAZ-0001/0002.
    D5: >-
      P1. `disabled` + `aria-describedby` apontando para id INEXISTENTE: o
      motivo do bloqueio era inalcançável por teclado e leitor de tela
      (SAF-0034; HAZ-0037). Atravessou toda a automação existente, incluindo
      axe em navegador real com contraste ligado.
    D6: 'P1. versaoRegra literal "RULE-NEWS2@0.2.0" no cliente (ADR-0021 F8).'
    D7: "P1. Linha de alerta sem referência de paciente (IA-N10)."
    D8: >-
      P1. Banner fundia divulgação TEMPORÁRIA (sintético) com obrigação
      PERMANENTE (registro limitado à instituição, ADR-0004 §6.2/HAZ-0046):
      remover a primeira levaria a segunda. Sem identificador estável, RLI-5
      não era atendido.
  verificacao:
    pnpm_verify: "exit 0 — 1.513 testes verdes, ZERO pulados, ZERO falhas (1.497 antes; +16)"
    e2e_navegador: "22/22 verdes, incluindo o cenário offline reescrito para provar focabilidade e o alvo do aria-describedby"
    gates_de_documento: "check_doc_conventions OK (250 arquivos); check_forbidden_content OK (595 arquivos)"
    biome: "sem erro em apps/web"
  lacunas_registradas_e_NAO_corrigidas:
    L1: >-
      A MAIS GRAVE. Não há SSE, polling nem refetch — de espécie alguma. A
      grade só muda por clique. O rótulo de frescor envelhece com a tela, e
      `desatualizado_apos_falha` exige uma recarga que falhou, que nunca ocorre
      se nenhuma é tentada. É HAZ-0025 ("clinicians trust a frozen board") e
      contraria SAF-0025. Recomendação de sequência: relógio de idade da visão
      ANTES de qualquer SSE — o backend já entrega heartbeat, cursor, replay e
      instrucao-reconciliacao prontos.
    L2: >-
      A UI não consegue dizer que a regra está em modo sombra: RegistroDeAvaliacao
      é omitido de OUTBOX_TO_CONTRACT_EVENT e de toda resposta HTTP. Viola
      QAS-0023 de forma mensurável. Correção é de BACKEND, não de apps/web.
    L3: >-
      Tipos REST escritos à mão sem gate de deriva — check_contratos.mjs
      confronta apenas os enums de EVENTO. BandaRisco segue traduzida à mão e a
      tradução desloca o vocabulário (contrato `alerta`/RCP medium vira `alto`).
    L4: "Sem roteamento: sem URL por leito, sem voltar, sem skip-link, sem title dinâmico."
    L5: >-
      A matriz WCAG enumera 14 dos 55 critérios A+AA (mais 1 AAA como alvo). O
      recorte passou a ser DECLARADO no módulo, na declaração e em teste; a
      cobertura NÃO foi ampliada. 2.4.1/2.4.2 falham hoje, por consequência de
      L4. [CORRIGIDO em vigilancia_despacho_contrato_2026_08_18: o valor
      original desta entrada (15/56) estava errado — 56 contava um critério
      removido na WCAG 2.2 — e foi corrigido para 14/55.]
    L6: "1 de 7 comandos de WorkItem tem endpoint — a lacuna é de backend."
    L7: "Sem design system/tokens; badge-tom sem variante escura; i18n pela metade; ISO cru na tela."
    L8: "apps/web/src/domain/news2.ts é uma 2ª fonte de semântica clínica — deve morrer com o mock."
    L9: "VAL-0027/0029/0031/0033 e as condições C2/C3 da ADR-0021 seguem ABERTAS. C3 é da engenharia."
  nada_foi_declarado: >-
    Nenhum gate aprovado, nenhum MG-* satisfeito, nenhum hazard fechado,
    nenhuma alegação de acessibilidade validada. Estado factual duro
    INALTERADO: 0 vias acionáveis, 47/47 inelegíveis, Observation não
    consumível, safety case M0, nenhum dado real acessado.
  nao_presuma_convergencia: >-
    Oito defeitos foram encontrados numa árvore que já passara por seis rodadas
    adversariais e por um gate verde. A taxa de achado não convergiu antes e não
    há razão para supor que convergiu agora.

vigilancia_despacho_contrato_2026_08_18:
  aviso: >-
    ESTADO VIVO. Commit b4634d7 (branch codex/lacunas-frontend-a11y, PR #8,
    ainda NÃO mesclado a esta data) alegou três fechos: recarga autoritativa
    do board (L1), despacho observável na projeção HTTP (L2) e gate de deriva
    REST (L3). Uma revisão adversarial independente (ic-revisor-adversarial,
    sem ter escrito nenhuma linha do diff) REFUTOU partes centrais das três
    alegações, com reprodução por execução — não por leitura de código. Duas
    das quatro foram corrigidas NESTA MESMA branch, antes de qualquer merge;
    duas seguem ABERTAS.
  pr: "https://github.com/Omni-Saude/intensicare-V2/pull/8"
  veredito_da_revisao: >-
    REFUTADO no agregado. Tabela completa (5 alegações, 14 achados numerados
    P1-P3) no corpo da revisão, não reproduzida aqui; resumo abaixo é o que
    muda a decisão de merge.
  achados_p1_corrigidos_nesta_branch:
    ACH_REV8_1: >-
      Após um tempo esgotado (não uma rejeição simples), a recarga autoritativa
      parava para sempre: nenhum novo ciclo era agendado e "Atualizando…"
      ficava preso indefinidamente — o mesmo modo de falha que L1 alegava ter
      fechado. Corrigido em apps/web/src/estado/recursoRemoto.ts (distinção
      entre "efeito encerrado" e "tentativa abortada"; AbortController
      permanece a fonte de verdade do cancelamento real, I5 intacta). Teste
      vermelho-antes/verde-depois em recargaAutoritativa.test.tsx.
    ACH_REV8_2: >-
      Um /v1/readyz que trava depois de UMA leitura de sucesso deixava a tela
      clínica com aparência saudável indefinidamente — violação direta de
      QAS-0023/SAF-0025, a alegação central de L2. Corrigido em
      apps/web/src/estado/prontidao.ts (leitura de prontidão em estado de
      falha vira `inalcancavel` mesmo havendo leitura anterior). Teste
      vermelho-antes/verde-depois em degradacaoNoPontoDeUso.test.tsx.
  achados_p1_ainda_abertos:
    ACH_REV8_3: >-
      `acionavel: true` é publicável a partir de registro forjado coerente ou
      de linha de banco adulterada competente — a "recalculação" por
      `ehAcionavel` (apps/api/src/regras/exposicao.ts) é checagem de
      COERÊNCIA entre campos do mesmo blob controlado pelo atacante, não de
      AUTORIDADE contra o rule-bundle assinado. Os 5 vetores testados só
      forjam incompetentemente (assinatura ausente).
    ACH_REV8_4: >-
      `exposicao.ts` não tem nenhum chamador de produção — nem rota, nem
      serializador, nem campo em `ResultadoAvaliacao` (packages/contratos) ou
      em openapi.yaml. "Despacho não se esconde mais" é falso: nenhum byte do
      envelope de despacho atravessa a fronteira HTTP nesta branch. QAS-0023
      permanece com a mesma contagem de antes de b4634d7.
    nota: >-
      NÃO corrigidos nesta rodada por decisão deliberada, não por omissão: os
      arquivos exigidos (apps/api/src/regras/, apps/api/src/composicao/,
      packages/contratos/, scripts/check_contratos.mjs) estavam sob edição
      ativa de OUTRA sessão no momento da revisão (evidência: git status
      mostrando os mesmos caminhos modificados/não commitados, incluindo um
      arquivo novo apps/api/src/composicao/despacho-visivel.test.ts cujo nome
      sugere que aquela sessão já endereça ACH_REV8_4 de forma independente).
      Escrever ali teria sido exatamente o anti-padrão "dois orquestradores na
      mesma árvore de trabalho". Retomar quando aquela janela fechar; conferir
      primeiro se despacho-visivel.test.ts já fecha ACH_REV8_3/4 antes de
      duplicar trabalho.
  achados_p2_p3_nao_corrigidos: >-
    Gate de deriva REST emudece 16 de 160 verificações quando dois arquivos
    opcionais faltam (sem `else`, exit 0 mesmo assim) — mesmo bloqueio de
    escrita que ACH_REV8_3/4. Teste-guarda "reescrito" do gate não pega a
    classe de defeito que alega pegar (reproduzido: reintroduzir o defeito
    original deixa o guarda verde) — mesmo bloqueio. "Vermelho-antes por
    mutação em três níveis" (L1) não é reproduzível a partir do repositório —
    nenhum arnês de mutação existe em apps/web; ou o arnês entra no
    repositório, ou a alegação deve ser rebaixada para "observado durante o
    desenvolvimento, não reproduzível".
  achados_p2_p3_corrigidos_nesta_branch: >-
    TOTAL_CRITERIOS_WCAG_22_AA estava em 56; o valor correto da WCAG 2.2
    A+AA é 55 (a REC de 05-out-2023 removeu 4.1.1 Parsing). Corrigido para
    derivação a partir de enumeração literal dos 55 critérios — nunca mais
    digitado à mão — em apps/web/src/a11y/matrizAcessibilidade.ts; ver L5
    corrigida acima. Regex da guarda de honestidade (`/\bconforme\b/i`) tinha
    furo de fronteira de palavra que deixava passar "Conformidade" — corrigido
    para `/conform/i`. Teste rotulado "guarda de não-vacuidade" provava
    ausência, não execução — nome e asserção corrigidos para dizer o que de
    fato provam.
  verificacao_apos_correcao: >-
    apps/web isolado: 20 arquivos, 256 testes verdes (era 247; +9 novos), zero
    regressão. tsc --noEmit exit 0. biome check nos 6 arquivos alterados: sem
    apontamento. pnpm verify completo NÃO rodado nesta rodada (árvore
    compartilhada com outra sessão ativa; risco de saturação já medido em
    ocasiões anteriores). E2E de navegador NÃO reexecutado (porta 3000 ocupada
    por processo da outra sessão durante a revisão original).
  nada_foi_declarado: >-
    Nenhum gate aprovado, nenhum MG-* satisfeito, nenhum hazard fechado.
    Estado factual duro INALTERADO: 0 vias acionáveis, 47/47 inelegíveis,
    safety case M0, nenhum dado real. PR #8 NÃO deve ser mesclado enquanto
    ACH_REV8_3 e ACH_REV8_4 continuarem abertos — ambos tocam a superfície que
    a própria branch alega ter corrigido (despacho observável, QAS-0023).

