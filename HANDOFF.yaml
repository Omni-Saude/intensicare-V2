  o_que_a_onda_4_ensinou_sobre_METODO:
    mutacao_nao_prova_aceitacao: >-
      MUTACAO PROVA QUE UM GATE REPROVA O ERRADO. NUNCA PROVA QUE ELE ACEITA O
      CERTO. O extrator da Parte G era cego a `readonly` (milhares de
      ocorrencias no repositorio; ZERO no unico arquivo contra o qual foi
      testado). A direcao pior nao seria pega por bateria de mutacao alguma:
      anotar `readonly` numa propriedade JA CONFORME fazia o gate REPROVAR
      documento correto, e o conserto natural de quem lesse a falha era apagar
      a propriedade do YAML — o gate ENSINAVA a criar a divergencia que existe
      para impedir. Todo gate precisa de bloco de CONFORMIDADE, nao so de
      mutacao.
    tripwire_pode_testar_a_imaginacao_do_autor: >-
      `expect(JSON.stringify(saneado)).not.toContain('"acionavel":true')`
      parecia guarda forte. Passava porque a forja do autor punha o campo
      DENTRO de `despacho`. No topo, atravessava. A correcao certa foi
      enumerar 17 POSICOES de injecao, cada uma com ancora propria, com e sem
      autoridade, mais varredura recursiva.
    guarda_pode_ser_invisivel_a_suite_inteira: >-
      Duas das tres guardas fail-closed de `lerModoDeDespacho` podiam ser
      REMOVIDAS com os 387 testes de apps/api VERDES, porque todo vetor
      carregava `assinatura_verificada` e so a terceira guarda decidia.
    exit_code_atraves_de_pipe: >-
      ERRO MEU: li "exit 0" de um `pnpm verify | tail` e quase reportei verde
      uma verify que REPROVOU. O exit era do `tail`. Nunca medir exit atraves
      de pipe.
    lint_da_raiz_ve_o_que_o_lint_de_caminho_nao_ve: >-
      `pnpm lint` e' `biome ci --error-on-warnings .` e cobre FORMATACAO.
      Agente que roda `biome check <caminhos>` nao ve. Uma divergencia de
      formatacao reprovou a primeira verify desta sessao.

