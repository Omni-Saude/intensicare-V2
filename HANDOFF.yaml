    (1) DATA (calendario/ano) fora de apps/web: MEDIDA e LIMPA. 1.289 testes
    verdes em 2027-03-05 e em 2019-11-02, um pacote por vez, load 2,7-8,0, zero
    falhas. Instrumento: shim que desloca APENAS Date (setTimeout e
    performance.now intactos), validado nos dois sentidos antes do uso.
    (2) TEMPORIZACAO real (setTimeout/performance.now) fora de apps/web: NAO
    MEDIDA, e com dependencia REAL confirmada — o proprio instrumento da (1)
    deixava setTimeout intacto, entao ele era estruturalmente incapaz de ver
    isto. Confirmados: `await dormir(1_100)` em
    apps/api/src/eventos/stream.test.ts:1061 (1,1 s de espera de parede real),
    mais oito esperas de 10-150 ms no mesmo arquivo, e lacos com teto de parede
    de 5.000 ms em seguranca.test.ts, e2e.fatia.test.ts e routes.test.ts — os
    tres ja documentados no proprio codigo-fonte como tendo produzido
    falso-negativo sob carga antes de corrigidos. CONSEQUENCIA OPERACIONAL: e'
    provavel que parte dos "Hook timed out" que esta bancada vem lendo como
    defeito venha DESTES tetos de parede sob contencao, e nao do codigo sob
    teste. Isso reforca a regra de uma coisa pesada por vez em vez de enfraquecer.
    RISCO RESIDUAL, nao fechado: pontos de fuga de relogio em CODIGO DE PRODUTO,
    com default de parede, que um teste futuro pode esquecer de injetar —
    expiracao de ticket em apps/api/src/eventos/ticket.ts, auth/verificador.ts,
    composicao/regras.ts, packages/conformidade/src/runner.ts e varios pontos de
    apps/api/src/db.ts. DELIBERADAMENTE SEM NUMERO DE LINHA: a versao anterior
    desta chave citava db.ts:179,327,557,827 e as linhas ja haviam derivado para
    197,345,582,869 quando foram reconferidas; citar linha aqui envelhece mais
    rapido do que o fato. Hoje nenhum desses pontos produz teste dependente de
    data (medido). O tratamento estrutural (caminho unico que nao aceita o
    parametro) e' mudanca de PRODUTO e precisa de dono.
