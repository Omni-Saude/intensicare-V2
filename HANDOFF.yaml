  F5_DATA_MEDIDA_TEMPORIZACAO_NAO_MEDIDA: >-
    RECONCILIADO em 2026-08-18 por medicao independente. A contradicao NAO era
    entre documentos de epocas diferentes: `git blame` mostra que esta chave e a
    frase oposta do PROMPT_IMPLEMENTACAO_FINAL §16 ("nao medida") foram escritas
