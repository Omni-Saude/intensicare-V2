    - "ACH-02 (P0): porta de autenticação única com verificador JWS e adaptador OIDC/JWKS fail-closed; 71 testes no escopo, incluindo alg=none, confusão HS/RS, issuer, audiência, kid, rotação, exp/nbf, adulteração, cross-tenant, m2m e ausência de fallback."
    - "ACH-03 (P1): PERFIL passou a ser OBRIGATÓRIO e sem default; PGlite, fixtures e token sintético são recusados fora de test/dev-synthetic."
    - "ACH-04 (P1): registro/despachante de regras versionado sobre bundle verificado, com kill switch e rollback provado por behaviorHash."
    - "ACH-05 (P1): asyncapi.yaml 3.0.0 publicado; entrega SSE contínua autorizada (provada por mutação), no lugar do replay finito."
    - "ACH-06 (P1): /v1/livez, /v1/readyz e /v1/startupz separados; prontidão e telemetria com consumidor real pela primeira vez."
    - "ACH-07 (P1): rejeição de rede produz erro acionável; AbortController real; token e mock REPROVADOS no build de produção; E2E de navegador e axe."
    - "ACH-08 (P1): artefatos não-root (UID 1000 e 101, medidos), SBOM determinístico, promoção que recusa tag e exige digest."
    - "ACH-09 (P2): estado por gate reconciliado entre Markdown, YAML e Mermaid por emenda datada."
  revisao_adversarial: >-
    CINCO revisões independentes por agentes que NÃO escreveram o código, e a
    taxa de achado NÃO CONVERGIU: rodadas 1..5 produziram 8, 6, 9, 12 e 12
    achados (vereditos REFUTADO, CONFIRMADO_COM_RESSALVAS, REFUTADO, REFUTADO,
    REFUTADO). Somam-se 2 defeitos achados fora das revisões — um por execução
    de navegador real, um pelo orquestrador ao validar migrações. TOTAL: 49
    achados, SETE deles P1 com leitura e escrita cross-tenant reproduzidas
    contra PostgreSQL real. A 5ª rodada REABRIU uma classe que a 4ª declarava
    fechada (pivô de tenant dentro da transação, agora por view
    auto-atualizável sobre a âncora do escopo), achou matview vazando em
    esquema PERMITIDO (intensicare_escopo, que o app precisa para chamar
    instalar) e uma guarda de não-vacuidade CIRCULAR que permitia 29 caminhos
    de escalada esvaziarem mantendo a suíte verde. NÃO trate a contagem de
    rodadas como prova de robustez: o padrão diz que o verificador terceiro
    (DEC-G0-02) encontrará mais.
  erros_do_orquestrador_registrados: >-
    (1) Duas vezes a verificação correu contra ARVORE EM MOVIMENTO, com agentes
    editando enquanto o revisor media — inclusive uma rodada declarada
    "congelada" que não estava. (2) O commit 9d0ef6c usou `git add -A` com um
    especialista em voo e levou uma alteração PARCIAL da migração 0003, sem
    0004 nem pool.ts; aquele commit não foi verificado como unidade. (3) A
    justificativa de que `nextval` atribui id de transação foi repassada a um
    especialista SEM verificação e gravada na 0004 como fato medido — é FALSA
    contra PostgreSQL 16.14, porque sequência é não-transacional.
  estado_duro_INALTERADO: >-
    0 vias clínicas acionáveis; 47/47 inelegíveis; Observation AMH não
    consumível; somente candidato a integração; safety case M0; NENHUM dado
    real acessado. Os seis pacotes de conteúdo clínico estão BYTE-IDÊNTICOS ao
    commit-base — confirmado por revisão adversarial: nenhum vetor, limiar,
    banda ou janela pôde ter mudado. Nenhum gate aprovado, nenhum MG-* satisfeito.
  consequencia_que_nao_deve_surpreender: >-
    /v1/readyz responde 503 PERMANENTE neste estado: o RULE-GCS não tem
    artefato de bundle e nenhum alvo de frescor foi validado (Gate G1). É o
    retrato honesto de um safety case em M0 com 0 vias acionáveis — não é
    defeito a contornar. Nenhum SLO foi inventado: todo limiteMs no código é
    null, e o veredito não PODE ser ready enquanto for, por construção.
  fila_do_titular_acrescida:
    - "PR #5 ABERTO em https://github.com/Omni-Saude/intensicare-V2/pull/5 — 10 checks de CI verdes; NAO fazer merge sem os checks e as autoridades aplicaveis (GDEC-0014)"
    - "PR de codex/finalizacao-plataforma-v2 para main (vinculante GDEC-0014); NENHUM push foi feito sem autorização"
    - "BLK-0003 / AUTH-SECURITY UNASSIGNED — é o bloqueio ANTERIOR a todos os de identidade: sem dono nomeado não há a quem pedir metadados de IdP"
    - "Ratificações clínicas R1..R7 do relatório final §8.1 (sedativeExposure ausente do contrato; vínculo terminológico GCS/RASS; partial->indisponivel no GCS; AUTORIA DO BUNDLE DO RULE-GCS, que é o que impede o GCS de ser despachável; código de NT fora do conjunto governado; mais as duas herdadas do ciclo 6)"
    - "Registry OCI com residência decidida, chave sob custódia (custodiante != dono do pipeline, DEC-G0-06) e OIDC de CI — sem eles assinatura, proveniência e promoção seguem NÃO EXECUTADAS"
    - "Ratificação dos limiares de scripts/politica-de-severidade.json (ADR-0022 §5.1 C4)"
    - "Reconciliação do vocabulário de perfis: 6 de runtime x 7 ambientes de ADR-0019 — coexistem três vocabulários não reconciliados"
    - "Decisão sobre tornar build-and-test, change-metadata e os 5 jobs de supply-chain checks obrigatórios da proteção da main"
  riscos_residuais_principais:
    - "32 P0 do threat model seguem OPEN (27 do corpo original + 5 acrescentados; o modelo declara 83 ameacas, todas OPEN). G6 exige verificador terceiro (DEC-G0-02) e aceite humano (MG-G6)."
    - "LIMITE ARQUITETURAL: enquanto a ancora de escopo for o selo em tabela, transacao somente-leitura e REPLICA DE LEITURA sao inviaveis — instalar precisa escrever. As tres alternativas (linha, advisory lock, sequencia) foram MEDIDAS e nao sobrevivem a ROLLBACK TO SAVEPOINT. Declarado em 0004_escopo_selado.sql e no README do pacote."
    - "A fronteira de IDENTIDADE AUTENTICADA é a que resta: o isolamento de armazenamento protege contra SQL arbitrário em voo, NÃO contra um chamador que peça o tenant errado (SEC-0001). Depende de IdP real."
    - "Troca de tenant entre transações distintas na mesma conexão continua possível e NÃO é fechável pelo banco — é assim que um pool multi-tenant funciona. Documentada em teste como LIMITE, não como controle."
    - "Gate estrutural ausente: a suíte roda com PERFIL e NODE_ENV ambos definidos; defeito que dependa da forma do ambiente real segue invisível por padrão."
    - "PortaMigracao (lock consultivo + versão durável de schema) sem implementação real; migrações concorrentes não serializadas."
    - "TLS na conexão de banco não coberto; custo de latência do selo de escopo não medido."
  medicoes_finais_2026_08_17:
    verify_maquina_ociosa: "pnpm verify exit 0, 1.476 testes em 11 pacotes, ZERO pulados, ZERO falhas, ZERO expected fail (kernel 305, api 336, rule-bundle 302, web 187, persistencia 83, vigilancia 77, conformidade 62, observabilidade 55, contratos 38, dominio 18, fixtures 13)"
    fronteira_postgres: "47 testes bloqueantes contra PostgreSQL 16.14 real"
    e2e: "22/22 Playwright, deterministico em 4 execucoes"
    contratos: "148 verificacoes (openapi + asyncapi)"
    ci_pr5: "10 checks verdes no commit 1a6f3df — build-and-test (pnpm verify com PostgreSQL real e IC_FRONTEIRA_PG=obrigatoria), ensaio-de-migracao, e2e-navegador, artefato-api, artefato-web, higiene-de-gate, vulnerabilidades-de-dependencia, doc-conventions, forbidden-content, change-metadata"
    F6_fuso_horario: "RESPONDIDO — TZ=Pacific/Kiritimati (UTC+14): exit 0, 1.476 testes, zero falhas. A suite NAO depende de fuso. TZ=Pacific/Niue (UTC-11) NAO foi medido."
  ARMADILHA_DE_MEDICAO_LOCAL: >-
    LEIA ANTES DE INTERPRETAR QUALQUER VERMELHO LOCAL. Nesta maquina um unico
    `pnpm verify` leva o load average a ~28 sozinho. Rodar QUALQUER outra coisa
    em paralelo (outro verify, uma revisao adversarial que roda verify, um teste
    de TZ) produz falhas por TIMEOUT que parecem defeitos e NAO SAO. O
    orquestrador cometeu esse erro tres vezes e chegou a relatar uma
    "dependencia de fuso horario" que era pura contencao — retratada depois com
    medicao isolada. REGRA: uma coisa pesada por vez; se houver vermelho,
    conferir `uptime` ANTES de concluir qualquer coisa; e o CI do PR #5 (runner
    limpo) e' evidencia mais confiavel que esta bancada.
  F5_NAO_MEDIDO: >-
    Independencia de RELOGIO fora de apps/web NAO foi medida. apps/web recebeu
    correcao estrutural (caminho unico de construcao que nao aceita agoraMs) e
    prova empirica com o relogio do sistema em 2027 e 2019. kernel-clinico,
    vigilancia, persistencia, conformidade e apps/api NAO receberam esse
    tratamento. Tecnica barata e nao invasiva: falsificar apenas `Date` no setup
    do vitest e rodar a suite em duas datas distantes. Num repositorio onde o
    relogio e' semantica clinica (frescor, janelas, reavaliacao em tempo de
    leitura), uma suite que so passa hoje e' defeito grave. UMA bomba-relogio
    real ja foi encontrada e corrigida em apps/web, armada as 12:55:00Z.
  SEXTA_REVISAO_NAO_CONCLUIDA: >-
    A 6a rodada adversarial foi despachada e NAO concluiu (morreu por contencao
    causada pelo proprio orquestrador, que rodava suites em paralelo). Alvos
    nomeados pelos especialistas ao fechar a 5a, todos ABERTOS: (F1) funcao
    SECURITY DEFINER de terceiro que leia o selo — o fecho de pg_rewrite cobre
    view/matview e NAO cobre funcao; (F2) ALTER TABLE ... INHERIT aplicado
    DEPOIS das migracoes, quando a auditoria ja rodou; (F3) outras assercoes
    derivadas do proprio dado sob teste (o padrao circular foi corrigido em 2
    lugares, pode haver irmaos); (F4) o contrato "escopo e' a primeira escrita"
    segue NAO VERIFICADO — e' leitura de codigo, nao teste; (F5) acima.
  comandos_de_retomada: "ver docs/15-release-evidence/final-implementation-report.md §14"

rules_for_any_resuming_agent:
  - Read docs/00-governance/evidence-notation.md before writing anything; front-matter is CI-enforced
  - Never name an owner, mark DECIDED, accept a risk, or resolve a contradiction — humans do that
  - Never modify the legacy or AMH repositories; AMH reads only at a freshly re-pinned commit
  - Specialists get narrow remits with disjoint write scopes (prompt §4); no generic agents
  - Stop at human gates and record precise unblock requests rather than proceed
