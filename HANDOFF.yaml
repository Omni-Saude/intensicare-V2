rules_for_any_resuming_agent:
  - Read docs/00-governance/evidence-notation.md before writing anything; front-matter is CI-enforced
  - Never name an owner, mark DECIDED, accept a risk, or resolve a contradiction — humans do that
  - Never modify the legacy or AMH repositories; AMH reads only at a freshly re-pinned commit
  - Specialists get narrow remits with disjoint write scopes (prompt §4); no generic agents
  - Stop at human gates and record precise unblock requests rather than proceed
