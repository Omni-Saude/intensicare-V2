# ci-plataforma.yml — gate de qualidade/build/teste do monorepo pnpm
# (SPR-G7-1; §15.1 itens A/B/D deste ciclo de construção).
#
# Escopo: instala as dependências do workspace (lockfile congelado) e, na
# mesma ordem que `pnpm verify` na raiz do repositório, roda: verificação
# de tipos (`pnpm -r typecheck`), lint/formatação (Biome, `pnpm lint`),
# fronteira de módulo (`pnpm check:boundaries`, materializa ADR-0002 §5.1
# condição C5), build (`pnpm -r build`) e testes (`pnpm -r test -- --run`).
# Complementa — não substitui — `docs-gates.yml` (convenções de
# documentação + conteúdo proibido/PHI) nem `metadados-gates.yml`
# (metadados de rastreabilidade de PR); nenhum dos três altera os outros
# dois.
#
# Teste de clean-install da migração SQL (`packages/persistencia`):
# CONFIRMADO que já roda aqui, dentro do passo "Testes de todos os
# pacotes/apps do workspace" — `packages/persistencia/src/test-support.ts`
# (`createTestDatabase()`) cria um PGlite novo e chama `runMigrations()`
# (aplica `src/migrations/0001_init.sql` e `0002_g7_integration.sql` do
# zero) a cada `describe`/`it` que precisa de banco; o describe
# "migração SQL pura (0001_init.sql)" de
# `packages/persistencia/src/migration-and-rls.test.ts` é a asserção mais
# direta disso (usuário/role pós-migração, tabelas clínicas esperadas
# presentes). Não há passo de CI separado para isso porque o pacote já o
# exercita em toda execução de teste — duplicar seria redundante, não mais
# seguro.
#
# PREMISSA (reversível, GDEC-0015/0017): Node.js 22 LTS + pnpm 9 (ver
# docs/06-architecture/premissas-de-construcao.md PRE-01).
#
# O job abaixo é inteiramente BLOQUEANTE — nenhum passo usa
# `continue-on-error` nem `if: always()` para engolir falha, na mesma
# linha de `docs-gates.yml`/`metadados-gates.yml`
# (INTENSICARE_V2_ORCHESTRATOR_PROMPT.md §3 regra 13; anti-padrão 11 do
# mesmo prompt: nenhum gate de qualidade fica "advisory"). Typecheck, lint
# e fronteira de módulo são passos dedicados, não dobrados dentro de
# `build`, exatamente para que uma falha de qualquer um deles apareça
# nomeada no resumo do workflow, não escondida atrás de "build failed".
#
# O lockfile (`pnpm-lock.yaml`) é responsabilidade de commit do
# orquestrador, não desta tarefa (ver instrução da fatia SPR-G7-1); até que
# ele exista no branch, o passo `pnpm install --frozen-lockfile` falha por
# desenho — isso é esperado e não é um defeito deste workflow.
#
# Actions pinadas por SHA de commit completo (nunca tag mutável), na mesma
# convenção de `docs-gates.yml`. Pin de `actions/checkout` reaproveitado
# daquele arquivo (já OBSERVADO ali). Pin de `actions/setup-node` (OBSERVADO
# 2026-08-16 via GitHub REST API, `git/refs/tags/<tag>` resolvido para um
# objeto de commit, checado contra `git/commits/<sha>` para uma data de
# commit plausível):
#
#   actions/checkout   @ 3d3c42e5aac5ba805825da76410c181273ba90b1  (tag v7.0.1)
#   actions/setup-node @ 820762786026740c76f36085b0efc47a31fe5020  (tag v7.0.0,
#     commit datado de 2026-07-14)
#
# Re-verificar estes pins periodicamente, como já observado em
# docs-gates.yml, em vez de confiar neles indefinidamente.

name: CI Plataforma

# Quotado pelo mesmo motivo documentado em docs-gates.yml: uma chave `on:`
# sem aspas é lida como o booleano `true` por parsers YAML 1.1 estritos.
"on":
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    # PostgreSQL REAL disponível para este job — ACHADO P2 de revisão
    # adversarial (2026-08-17).
    #
    # A suíte de fronteira de isolamento de tenant
    # (`packages/persistencia/src/postgres/fronteira-postgres.test.ts`) é a
    # única evidência de que a RLS por tenant vale no motor de produção, e não
    # apenas no simulador embarcado. Ela se pula com aviso ruidoso em máquina de
    # desenvolvimento sem PostgreSQL, e FALHA quando `CI=true` — desenho
    # correto. A consequência era, porém, que `pnpm verify` neste workflow
    # nunca podia terminar verde COM a verificação P0 executada: ou o runner
    # não tinha PostgreSQL e o job falhava, ou alguém a tornaria opcional.
    #
    # Com o serviço abaixo e `PG_TEST_URL` definida no ambiente do job, a
    # suíte roda de verdade dentro do `pnpm test` que o `pnpm verify` invoca.
    # "verify verde" passa a significar "fronteira P0 exercitada contra
    # PostgreSQL real" neste workflow — que é a equivalência que a revisão
    # mostrou não existir antes.
    #
    # `test:fronteira` deliberadamente NÃO foi acrescentado à sequência de
    # `pnpm verify` na raiz: isso quebraria a máquina de todo desenvolvedor
    # que não tenha PostgreSQL instalado, trocando um problema de cobertura de
    # CI por um de ergonomia local. O lugar de exigir a dependência é o
    # ambiente que a fornece.
    services:
      postgres:
        # Digest, nunca tag mutável — mesma regra dos pins de action acima e
        # do artefato (ADR-0022 S7). Mesmo digest já OBSERVADO em
        # `supply-chain.yml` (`docker buildx imagetools inspect`, 2026-08-17).
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          # Credencial efêmera de serviço de CI, destruída com o runner, sem
          # nenhum dado real (100% sintético). NÃO é segredo de ambiente algum:
          # não existe fora deste job (ADR-0019 §5.2 P5).
          POSTGRES_PASSWORD: postgres-efemero-de-ci-SYNTH
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Sem health check o job corre contra um servidor que ainda não aceita
        # conexão e falha de forma intermitente — flake que depois se "resolve"
        # com retry, escondendo falha real.
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Lida por `scripts/pg-efemero.mjs` e pela suíte de fronteira. Com ela
      # definida, nenhum cluster efêmero é criado: o serviço acima é reusado.
      PG_TEST_URL: postgresql://postgres:postgres-efemero-de-ci-SYNTH@127.0.0.1:5432/postgres
      # Torna a ausência de PostgreSQL um ERRO explícito em vez de um pulo
      # silencioso — se o serviço não subir, o job precisa falhar dizendo isso,
      # nunca reportar verde com a verificação P0 ausente.
      IC_FRONTEIRA_PG: obrigatoria
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Ativar pnpm 9 via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile
      # UM ÚNICO comando, deliberadamente: `pnpm verify` é a MESMA sequência
      # que o desenvolvedor roda localmente (README, seção "Como desenvolver").
      #
      # Antes, este workflow repetia a lista de passos à mão. As duas cópias
      # divergiam sem que ninguém notasse — e ambas carregavam o mesmo defeito
      # latente: `typecheck` antes de `build`. Como os pacotes do workspace
      # resolvem tipos por `dist/*.d.ts`, o typecheck só passava em máquina que
      # já tivesse buildado antes; em checkout limpo (isto é, no CI e em
      # qualquer clone novo) quebrava com TS2307. O verify local ficava verde
      # por acidente — pior que vermelho, porque mentia.
      #
      # Uma definição, um caminho de execução: verde local passa a significar
      # verde no CI. A atribuição da falha continua legível no log, que mostra
      # qual etapa do `verify` quebrou.
      - name: Verificação completa (pnpm verify — mesma sequência do local)
        run: pnpm verify

  # ---------------------------------------------------------------------------
  # E2E de navegador e acessibilidade automatizada — BLOQUEANTE.
  #
  # Job separado de `build-and-test` porque baixa um navegador e sobe dois
  # servidores; misturá-lo ao `verify` tornaria o gate principal dependente de
  # rede e mais lento para todo mundo. Separado, mas NÃO opcional: sem
  # `continue-on-error` e sem `if: always()`.
  #
  # POR QUE ELE PRECISA EXISTIR (achado P2 de segunda revisão adversarial,
  # 2026-08-17). `apps/web/src/a11y/matrizAcessibilidade.ts` declara cinco
  # critérios WCAG (1.4.3, 1.4.10, 1.4.11, 2.4.7, 2.5.8) com execução
  # `executado`, e um teste de unidade assere essa declaração. Mas quem os
  # exercita de fato é a suíte Playwright, e nenhum workflow a executava: a
  # declaração validava a si mesma, sem artefato de execução — "tratar
  # implementação como verificada", anti-padrão 24. Ou a suíte roda num gate,
  # ou a declaração precisa ser rebaixada. Esta é a primeira opção.
  #
  # A suíte não exige PostgreSQL: o `webServer` do `playwright.config.ts` sobe a
  # API em perfil `dev-synthetic`, que usa PGlite em memória com fixtures
  # sintéticas — o mesmo caminho que o desenvolvedor roda localmente.
  #
  # LIMITE QUE ESTE JOB NÃO FECHA: automação WCAG não é validação com usuários
  # de tecnologias assistivas. Os critérios marcados `manual_obrigatorio` na
  # matriz continuam NÃO EXECUTADOS e dependem de ato humano (MG-G4).
  e2e-navegador:
    name: e2e-navegador
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Ativar pnpm 9 via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile
      # OBRIGATÓRIO ANTES DO E2E, e a razão merece ficar escrita.
      #
      # O `webServer` do Playwright sobe `apps/api` por `tsx`, a partir do
      # FONTE. Mas os pacotes do workspace são resolvidos por `dist/*.js`, e em
      # checkout limpo `dist/` não existe: o servidor morre com
      # `ERR_MODULE_NOT_FOUND` para `@intensicare/contratos/dist/index.js`, e o
      # Playwright só reporta "Timed out waiting 120000ms from config.webServer"
      # — uma mensagem que não diz nada sobre a causa.
      #
      # É exatamente a armadilha que o ciclo 6 já documentou para o `typecheck`
      # antes do `build`: em máquina aquecida o erro não aparece, em checkout
      # limpo sim, e o verde local é acidente. Foi reintroduzida aqui na
      # primeira versão deste job e apanhada pelo próprio CI, na primeira
      # execução — que é o argumento para o job existir.
      - name: Construir pacotes do workspace (dist/ é pré-requisito do webServer)
        run: pnpm build
      - name: Instalar navegador do Playwright
        run: pnpm test:e2e:instalar
      - name: E2E autenticado e acessibilidade automatizada
        run: pnpm test:e2e
