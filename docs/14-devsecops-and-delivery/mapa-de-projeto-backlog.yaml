sequence_risks:
  - id: SR-1
    condition: "propagações residuais de GDEC-0008 não persistidas (linha na tabela-índice do registro; pedido §6; traceability-policy §1.1; L-4/L-6; marca P-1) e espelho YAML deste mapa não rastreado"
    consequence: "fontes internas divergem entre si; o mapa perde o espelho legível por máquina em sessão futura (anti-padrões 4/7)"
    mitigation: "SPR-G0-1 primeiro; commit do YAML pelo dono da janela correta (anti-padrão 14)"
    tracked_ids: [GDEC-0008]
  - id: SR-2
    condition: "qualquer demonstração, treinamento ou piloto visível a clínicos antes da captura B1-B4a"
    consequence: "perda permanente dos baselines; SM-01/SM-04/HM-02/HM-05 inavaliáveis para sempre"
    mitigation: "serialização dura: SPR-G1-5 antes de qualquer exposição; prioridade de sequência, não data"
    tracked_ids: [RISK-0008, VAL-0035, G2-VAL-0025, ASM-0007]
  - id: SR-3
    condition: "implementação (G7) ou escolha tecnológica antes de ADR aceito e propagado"
    consequence: "tecnologia fora do processo de ADR (§3.14); retrabalho; fronteira decidida por omissão"
    mitigation: "DoR de SPR-G7-1 exige SPR-G4-2; capacidades descritas como requisito até lá"
    tracked_ids: [RISK-0010]
  - id: SR-4
    condition: "espera indeterminada de terceiros: parecer, ética, usuários, pentest, ambientes AMH stg/prod"
    consequence: "caminhos do titular/AMH/externos param sem data prevista; pressão por atalho"
    mitigation: "explicitar espera; avançar trilha sintética V2; jamais converter dependência em compromisso"
    tracked_ids: [BLK-0013, BLK-0014, BLK-0015, RISK-0004]
  - id: SR-5
    condition: "colisão de rótulos N-* (dois namespaces) e dispersão de VAL-*/N-* sem registro central"
    consequence: "rastreabilidade ambígua em contrato e conformidade; citação errada em release evidence"
    mitigation: "steward desambiguar na propagação (SPR-G0-1); registrar em traceability-policy §1.1"
    tracked_ids: [GDEC-0002]
  - id: SR-6
    condition: "consumidor de eventos implementado antes do fechamento de N-8 (5×6 tipos)"
    consequence: "retrabalho de contrato/consumidor; risco clínico em reassignment sem alcance definido"
    mitigation: "ASM-0009 (tipo desconhecido = erro fail-closed) até SPR-G3-7; quarentena fail-closed proposta (N-13)"
    tracked_ids: [ASM-0006, ASM-0009]
  - id: SR-7
    condition: "tratar preparação como conclusão (kit, harness, minuta, specs 0.2.0, CRV DRAFT)"
    consequence: "gate declarado satisfeito sem evidência de execução (anti-padrões 1/15)"
    mitigation: "estados deste mapa separam preparação/decisão/implementação/verificação/aprovação; contagens honestas preservadas"
    tracked_ids: [GDEC-0007]
  - id: SR-8
    condition: "propagações pendentes acumulam (adr-index, pedido §6, hard-gate §7, L-4/L-6)"
    consequence: "fontes divergem entre si; próxima sessão re-deriva estado errado"
    mitigation: "SPR-G0-1 como primeiro sprint V2; ler-antes-de-escrever"
    tracked_ids: [GDEC-0007, GDEC-0008]
  - id: SR-9
    condition: "confusão nominal entre gates de ciclo de vida (G0–G8) e hard-gates 1–11 do §6.2"
    consequence: "leitura errada de estados (ex.: hard-gate 4 FAIL lido como Gate G4)"
    mitigation: "este mapa usa Gn só para ciclo de vida e 'hard-gate n (§6.2)' para elegibilidade"
    tracked_ids: [GDEC-0007]
