# =============================================================================
# IntensiCare V2 — Backlog legível por máquina do mapa até produção
# Espelho de docs/14-devsecops-and-delivery/mapa-de-projeto-ate-producao.md
# (mesmos IDs, mesma estrutura lógica). Status PROPOSAL: nada aqui decide,
# aprova, fecha ou encerra gate, bloqueador, risco, hazard, ADR ou OS.
# Esforço P/M/G é relativo — não é prazo, compromisso, SLA nem data.
# Nenhum alias YAML; nenhuma data usada como cronograma.
# tracked_ids lista os IDs principais de cada sprint; faixas extensas são
# declaradas em tracked_id_ranges (forma "PREFIXO-aaaa..PREFIXO-bbbb") para
# manter o arquivo legível — a expansão textual completa está no Markdown.
# =============================================================================

metadata:
  title: "Mapa ágil e rastreável do IntensiCare V2 até produção — backlog"
  status: PROPOSAL
  language: pt-BR
  source_branch: cycle-1/clinical-content
  source_branch_note: "conteúdo originado em cycle-1/clinical-content; integrado à main em 75838b5 durante a produção do mapa"
  companion_document: docs/14-devsecops-and-delivery/mapa-de-projeto-ate-producao.md
  estimation_scale:
    P: "escopo estreito, poucas dependências, baixa incerteza"
    M: "múltiplos artefatos ou dependências moderadas"
    G: "transversal, dependência externa, alta incerteza ou validação extensa"
  id_prefixes_locais_pendentes_ratificacao:
    - "MD (marco de decisão do titular)"
    - "MG (marco humano de saída de gate)"
    - "EPC (épico)"
    - "SPR (sprint/pacote de trabalho)"
    - "SR (risco de sequência)"
    - "OC (operação contínua)"
  estado_factual_preservado:
    - "vias acionáveis: 0"
    - "matriz §7.2: 47/47 inelegíveis"
    - "Observation AMH: não consumível"
    - "compatibilidade: somente candidato a integração"
    - "safety case: maturidade M0"
    - "ambientes AMH stg/prod: inexistentes"

