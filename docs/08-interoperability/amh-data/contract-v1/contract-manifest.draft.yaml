  repository: Omni-Saude/intensicare-V2
  branch_at_drafting: cycle-1/clinical-content            # OBSERVADO localmente
  consumer_commit_at_drafting: fc8c98f18f8553253627bfb0f6493d782a43c93d  # OBSERVADO (git rev-parse HEAD, 2026-08-15)
  consumer_commit_nota: >-
    Commit da V2 no qual esta minuta foi redigida. O commit consumidor do
    contrato ACEITO sera o commit da V2 que pinar o manifesto publicado.
  owner: UNASSIGNED — VALIDATION REQUIRED
