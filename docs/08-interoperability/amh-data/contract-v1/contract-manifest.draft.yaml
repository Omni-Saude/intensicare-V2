# -----------------------------------------------------------------------------
producer:
  name: AMH Data Platform
  repository: Omni-Saude/amh-data-platform
  # Campo presente conforme OS-19 criterio 1; valor so existira quando a AMH
  # publicar o pacote a partir de um commit dela.
  amh_commit_sha: VALIDATION_REQUIRED  # ate publicacao pela AMH
  amh_commit_sha_nota: >-
    O commit de EVIDENCIA desta minuta e 0a07a6f1fab36fb2f5eeee0fcd8e945c95f67116
    (snapshot pinado do dossie) — ele NAO e o commit produtor do contrato, que
    ainda nao existe.
  owner: UNASSIGNED — VALIDATION REQUIRED   # dono AMH: criterio 6 da OS-19; ponto de negociacao N-1
  proposed_manifest_path: schemas/contracts/intensicare/v1/contract-manifest.yaml
  proposed_manifest_path_status: PROPOSAL — caminho no repo AMH e ponto de negociacao N-2

# -----------------------------------------------------------------------------
# CONSUMIDOR — IntensiCare V2
