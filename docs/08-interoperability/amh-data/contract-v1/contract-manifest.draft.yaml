    Nenhum identificador de fonte (mpi_id cru, CPF, prontuario) em nenhuma
    mensagem, fixture ou log.
  por_artefato:
    contract-manifest: "sem PHI; refs opacas; sem endpoint, credencial ou segredo"
    eventos-ciclo-de-vida: "sem PHI; refs opacas antiga/nova; tempos e chaves tecnicas apenas"
    resolve-operation: "sem PHI; entrada ref opaca + as_of; saida refs opacas + cadeia de alias"
    fixtures: "100% sinteticas; PSR com marcador SYNTH; nenhum identificador real"
  dados_reais: "PROIBIDOS nesta fase — DEC-G0-03; desbloqueio somente via OS-16 + gates G6/G8"

