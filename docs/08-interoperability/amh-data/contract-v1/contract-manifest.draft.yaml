  status: "DECISAO PROIBIDA nesta minuta — a escolha pertence ao ADR de fronteira (§7.5)"
  opcoes_a_comparar:
    - FHIR REST/Subscriptions
    - stream de eventos publicado
    - lote controlado (batch exchange)
  criterios_de_comparacao:
    - latencia
    - durabilidade
    - replay
    - acoplamento
    - aderencia a padroes
    - realidade operacional AMH
    - custo
  nota: >-
