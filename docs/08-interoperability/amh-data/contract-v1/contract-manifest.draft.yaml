governance_roles:
  clinical_data_steward: UNASSIGNED — VALIDATION REQUIRED
  producer_owner: UNASSIGNED — VALIDATION REQUIRED       # espelha producer.owner
  consumer_owner: UNASSIGNED — VALIDATION REQUIRED       # espelha consumer.owner
