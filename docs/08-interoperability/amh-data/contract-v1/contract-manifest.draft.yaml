  package_version_alvo: 1.1.0          # DECIDIDO (AQ-2): a V2 pina a 1.1.0, nao a 1.0.0
  package_version_observada_no_snapshot: 1.0.0   # OBSERVADO @0a07a6f1 — NAO e o alvo
  package_digest: null
