# =============================================================================
# contract-manifest.draft.yaml — MINUTA V2 do manifesto do contrato
# AMH×IntensiCare v1
# =============================================================================
#
#   status: MINUTA (DRAFT) — PROPOSAL — NAO ACEITO, NAO PUBLICADO, NAO PINADO
#
# O QUE ESTE ARQUIVO E
#   A proposta COMPLETA, do lado V2, do conteudo do manifesto de contrato que a
#   AMH criara no repositorio dela (OS-19; caminho proposto:
#   schemas/contracts/intensicare/v1/contract-manifest.yaml). O contrato e
#   AMH-owned (XRD-04): a V2 PROPOE, nao coloca. Este arquivo e a minuta para
#   negociacao — nada aqui vincula nenhuma das partes.
#
# O QUE ESTE ARQUIVO NAO E
#   - NAO e um contrato aceito. Aceitacao exige donos AMH e V2 nomeados; o
#     steward que redigiu esta minuta NAO aceita contrato.
#   - NAO e evidencia de compatibilidade. O achado permanece: candidato a
#     integracao; compatibilidade nao demonstrada para avaliacao de UTI
#     acionavel (compatibility-finding.md).
#   - NAO escolhe transporte. Nenhum transporte e implicito (ver secao
#     `transport` abaixo e memoria-de-desenho.md §7).
#   - NAO pina nada: todo digest esta null; pinned: false em tudo.
#
# PADRAO SEGUIDO
#   Maezo-equivalente: o PADRAO de publicacao do manifesto Maezo
#   (schemas/contracts/maezo/v1/contract-manifest.yaml@0a07a6f1, OBSERVADO em
#   2026-08-15 via API de conteudo, somente leitura) e seguido em estrutura e
#   rigor. Topicos, payloads e o envelope congelado de 28 campos do Maezo NAO
#   sao copiados (proibicao do §7.5 do prompt; envelope menor e rigorosamente
#   governado — ver memoria-de-desenho.md §5 para o racional da minimizacao).
#
# ROTULOS EPISTEMICOS: DECIDIDO refere-se exclusivamente a decisoes de
# rodaquino-OMNI em 2026-08-15, lavradas na ata
# identity-adjudication/adjudicacao-decisoes-2026-08-15.md (IDN-ADJ-2026-08-15).
# Tudo o mais e PROPOSAL, OBSERVADO ou VALIDATION_REQUIRED, conforme marcado.
#
# Sem PHI, credenciais, tokens, endpoints ou segredos. Dados de exemplo 100%
# sinteticos (fixtures/). Idioma pt-BR (DEC-G0-10).
# =============================================================================

manifest_version: 0.1.0-draft
status: DRAFT                          # ciclo de vida: draft -> proposed -> published
lifecycle_status: draft
contract_name: amh-intensicare-boundary
contract_semver_alvo: 1.0.0            # PROPOSAL — semver do contrato quando publicado
canonical_schema_version: null         # sera fixada na publicacao pela AMH

# Digest do proprio manifesto: como no padrao Maezo, nao pode viver dentro
# dele — e calculado sobre o arquivo PUBLICADO e registrado no pin imutavel do
# consumidor (contracts.lock da V2). Nesta minuta: null por definicao.
manifest_sha256: null
manifest_sha256_status: VALIDATION_REQUIRED — calculado somente na publicacao AMH

language_policy: pt-BR (DEC-G0-10)

authority_basis:
  - "AQ-3 = C — DECIDIDO por rodaquino-OMNI em 2026-08-15 (ata IDN-ADJ-2026-08-15 §2): tutela da saude no loop clinico; usos secundarios bloqueados"
  - "AQ-4 = A plena — DECIDIDO 2026-08-15 (mesma ata): PSR obrigatorio como identificador de fronteira, sempre qualificado por encontro"
  - "AQ-5 = A vinculante — DECIDIDO 2026-08-15 (mesma ata): eventos de ciclo de vida de identidade + resolve(ref, as_of) obrigatorios; sem eles o G3 nao passa"
  - "OS-19 — ordens-de-servico-amh-2026-08-15.md §6 (criterios de aceitacao do manifesto)"
  - "INTENSICARE_V2_ORCHESTRATOR_PROMPT.md §7.5 — conteudo exigido do pacote de contrato e Gate G3"

# -----------------------------------------------------------------------------
