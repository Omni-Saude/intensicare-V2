# -----------------------------------------------------------------------------
# POLITICA DE COMPATIBILIDADE, DEPRECIACAO E NOTIFICACAO (OS-19 criterio 1)
# -----------------------------------------------------------------------------
compatibility_policy:
  modo_proposto: BACKWARD              # PROPOSAL — mesmo modo exercido no Maezo
  regras:
    - "Mudanca compativel (afrouxar cardinalidade, campo opcional novo): versao minor; consumidor nao quebra"
    - "Mudanca INCOMPATIVEL (apertar cardinalidade, remover campo, mudar semantica de ref ou de tempo): versao major + janela de depreciacao + rota de notificacao"
    - "Toda mudanca de envelope de evento de identidade e decisao de contrato VERSIONADA e AMH-owned"
    - "Divergencia entre manifesto publicado e artefato publicado e defeito de publicacao: consumidor rejeita o pacote"
  forward_compatibility: >-
    O consumidor V2 ignora campos desconhecidos ADICIONAIS sem falhar
    (tolerant reader), mas rejeita mensagem sem os campos obrigatorios do
    envelope minimo.

deprecation_window:
  valor: null
  status: VALIDATION_REQUIRED — ponto de negociacao N-4
  estrutura: >-
    A janela sera expressa como: aviso minimo (dias) antes de desativar
    versao major anterior + periodo de operacao paralela das duas versoes.
    Valores a negociar com o dono AMH; nenhum numero inventado nesta minuta.

change_notification_route:
  rota_atual_observada: >-
    OBSERVADO (ata §5): a rota vigente para itens de trabalho e o documento
    de ordem de servico AMH (ordens-de-servico-amh-2026-08-15.md).
  rota_proposta_para_o_contrato: >-
    PROPOSAL: mudanca de contrato = PR no repositorio AMH tocando
    schemas/contracts/intensicare/** + incremento de versao neste manifesto +
    notificacao registrada ao dono consumidor V2 ANTES do merge. Canal
    humano de notificacao: VALIDATION_REQUIRED (ponto de negociacao N-5;
    nenhum endereco ou canal e registrado por agente).

