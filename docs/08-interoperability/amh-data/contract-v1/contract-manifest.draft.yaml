# -----------------------------------------------------------------------------
# EXCLUSOES EXPLICITAS (OS-19 criterios 1 e 5)
# Registradas para que ausencia nunca seja lida como afirmacao.
# -----------------------------------------------------------------------------
explicit_exclusions:
  - item: sinais vitais
    motivo: >-
      Contradicao C-1 ABERTA: o unico profile de Observation da IG fixa
      category em laboratory, excluindo estruturalmente sinais vitais de
      instancia conforme. Exigiria novo profile e nova decisao de produto
      (Q1). Nenhuma resolucao de 2026-08-15 os desbloqueia.
  - item: Observation laboratorial
    motivo: >-
      Excluida ATE evidencia da OS-20 aceita pelo caminho ESTRUTURADO
      Diagnose/LIS (code LOINC + valueQuantity UCUM, povoamento medido). O
      caminho de texto livre (code.text + valueString), se executado, fica
      explicitamente FORA deste contrato e nao conta como desbloqueio.
  - item: replay/backfill/correcao de dados clinicos e procedimento de reconciliacao
    motivo: >-
      Garantias desconhecidas neste ciclo (VALIDATION_REQUIRED no lock draft).
      NAO confundir com o replay de EVENTOS DE IDENTIDADE, que E clausula
      obrigatoria (identity_lifecycle). A reconciliacao de dados clinicos e
      objeto de negociacao futura, fora do v1.
  - item: usos secundarios (pesquisa, analytics, compartilhamento)
    motivo: "BLOQUEADOS por AQ-3 ate infraestrutura real de consentimento; OS-21 diferida"
  - item: escrita V2 -> AMH (writeback)
    motivo: "Fora do v1; OBSERVADO 'so a AMH escreve no HAPI'; exigiria contrato proprio"
  - item: corpus historico com URL de profile incorreta
    motivo: "Decisao sobre o acervo (11,4 milhoes de recursos, alegacao FONTE) e da AMH — OS-07 criterio 4; ponto de negociacao N-7"

