# -----------------------------------------------------------------------------
# CLAUSULA 1 — SUJEITO DO CONTRATO (AQ-4, DECIDIDO 2026-08-15)
# -----------------------------------------------------------------------------
subject:
  identifier: portable_subject_ref
  formato: "amh:psr:v1:<uuidv4>"       # AMH-020b §1.1, via ata IDN-ADJ-2026-08-15
  obrigatorio: true                    # DECIDIDO — AQ-4 = A plena
  escopo_de_estabilidade: "{amh_tenant, legal_entity}"
  qualificacao_de_encontro: >-
    DECIDIDO (AQ-4): a ref e independente de encontro, porem SEMPRE
    transmitida qualificada por encontro. A V2 chaveia fatos clinicos pelo
    par (PSR, encontro). Nenhuma mensagem deste contrato transporta PSR sem
    qualificacao de encontro, exceto os eventos de ciclo de vida de
    identidade e a operacao resolve, que operam sobre a ref em si.
  proibicoes:
    - "Nenhum mpi_id cru atravessa a fronteira (AQ-4; XRD-05)"
    - "Nenhum CPF ou identificador de fonte atravessa a fronteira"
    - "PSR nunca e re-mintado e nunca morre (AMH-020b, via ata); erasure marca retired, nunca deleta"
  ambiente_de_desenvolvimento: >-
    PSRs SINTETICOS em dev (prefixo de exemplo nesta minuta:
    "amh:psr:v1:SYNTH-..."), mintados pela AMH em producao. DEC-G0-03: apenas
    dado sintetico ate ratificacao juridica.

# -----------------------------------------------------------------------------
# CLAUSULA 2 — CICLO DE VIDA DE IDENTIDADE (AQ-5, DECIDIDO, VINCULANTE)
# Sem esta clausula o Gate G3 NAO passa. Nao se admite janela-teto.
# Especificacao completa: eventos-ciclo-de-vida-identidade.md (mesma pasta).
# -----------------------------------------------------------------------------
identity_lifecycle:
  obrigatorio: true                    # DECIDIDO — AQ-5 = A vinculante
  spec: docs/08-interoperability/amh-data/contract-v1/eventos-ciclo-de-vida-identidade.md
  event_types:                         # seis tipos, conforme OS-17 criterio 1
    - identity.alias.v1
    - identity.merge.v1
    - identity.unmerge.v1              # unmerge/split
    - identity.restore.v1
    - identity.reassignment.v1
    - identity.erasure.v1
  event_types_nota_divergencia: >-
    OBSERVADO: a ata IDN-ADJ-2026-08-15 §2 (AQ-5) lista literalmente cinco
    tipos (alias, merge, unmerge, restore, erasure); a OS-17 e o bloco de
    decisoes do contracts.lock.draft.yaml listam seis, incluindo
    reassignment. Esta minuta segue os SEIS da OS-17 (derivacao de
    engenharia mais especifica); a divergencia esta registrada como ponto
    em aberto N-8 (memoria-de-desenho.md §8) para confirmacao do titular.
    A ata prevalece quanto ao teor: se o titular confirmar cinco,
    reassignment sai por emenda simples.
  entrega: at-least-once               # DECIDIDO na ata (AQ-5): "entrega at-least-once"
  ordenacao: por sujeito               # DECIDIDO na ata (AQ-5): "ordenacao por sujeito"
  idempotencia: >-
    Toda mensagem carrega chave de idempotencia; o consumidor deduplica por
    ela. Redelivery nao pode alterar o estado reconstruido.
  latencia: VALIDATION_REQUIRED        # OS-17 criterio 3: declarada E medida pela AMH — nao inventar
  replay: >-
    Requisito vinculante: um consumidor que processe os eventos desde o
    inicio reconstroi a visao historica correta (OS-17 criterio 5). Vinculo
    com DOM-0002 (cadeia de proveniencia imutavel) e DOM-0003 (avaliacao
    deterministica e replayavel).
  resolve_operation:
    nome: resolve(ref, as_of)
    obrigatorio: true                  # DECIDIDO — AQ-5; OS-18
    semantica: >-
      Resolucao PONTO-NO-TEMPO: responde "a que esta ref se referia naquele
      instante", nao apenas "a que se refere agora". Devolve tambem a cadeia
      de alias aplicavel. as_of anterior ao minting e ref retired tem
      semantica declarada; ref desconhecida ou as_of fora de janela NEGA
      (fail-closed) — nunca adivinha. Especificacao completa no doc da
      clausula (§4).
    latencia_e_limites: VALIDATION_REQUIRED   # OS-18 criterio 5 — declarados pela AMH, nao inventados

# -----------------------------------------------------------------------------
# CLAUSULA 3 — FINALIDADE E BASE LEGAL (AQ-3, DECIDIDO 2026-08-15)
# -----------------------------------------------------------------------------
purpose_model:
  base_legal_loop_clinico: >-
    DECIDIDO (AQ-3 = C): tutela da saude — LGPD Art. 11, II, alinea "f" —
    em procedimento realizado por profissionais/servicos de saude, para o
    laco clinico single-tenant em contexto de tratamento.
  gate_do_loop_clinico: >-
    O loop clinico NAO tem gate de consentimento. O gate exigivel e
    proposito-de-uso + autorizacao de contexto profissional.
  purpose_of_use:
    obrigatorio: true
    valores_permitidos_v1: [tratamento]
    nota: >-
      Vocabulario deliberadamente minimo: o contrato v1 cobre APENAS o loop
      clinico. Qualquer outro proposito e rejeitado fail-closed.
  usos_secundarios: >-
    BLOQUEADOS (AQ-3): pesquisa, analytics e compartilhamento permanecem fora
    deste contrato ate existir infraestrutura real de consentimento
    (mpi.consent_log tem zero produtores — ADR-045, via ata). OS-21 diferida.
  consent_decision_ref:
    presente_no_envelope: false        # PROPOSAL — ver justificativa
    justificativa: >-
      Sob AQ-3 = C nao ha decisao de consentimento no loop clinico; carregar o
      campo sugeriria um gate que nao existe (risco que a OS-13 criterio 3
      manda evitar). A forma final e objeto da OS-13 (SP-4), a ratificar com o
      parecer juridico da OS-16. Se a AMH preferir campo presente com marcador
      de base legal, e mudanca compativel — ponto de negociacao N-6.
    invariante: >-
      Jamais deriva de ie_perm_sms_email ou de qualquer permissao de contato
      (AQ-3; verificavel em teste).
  ratificacao_juridica: >-
    VALIDATION_REQUIRED — a qualificacao da base legal exige ratificacao por
    advogados brasileiros ANTES de qualquer dado real, operacao sombra ou
    piloto (DEC-G0-03; OS-16; gatilhos G6/G8). Ate la: dados sinteticos
    exclusivamente.

