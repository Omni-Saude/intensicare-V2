  - id: NEWS2-G
    regra: RULE-NEWS2 0.2.0
    classe_do_insumo: ordem/flag governada (não é Observation)
    origem_na_spec: "TABELADO — spec §2.1 linha G e §3.2"
    pathway_and_version: {valor: "RULE-NEWS2 0.2.0 — governança da escala de SpO2", status: declarado_na_spec, nota: N-SPEC-WORKING-TREE}
    input_concept: {valor: "Atribuição de escala de SpO2 (escala 1 × escala 2), como ORDEM CLÍNICA ATRIBUÍVEL e estruturada, com autor, horário e indicação registrados", status: declarado_na_spec}
    mandatory_or_optional:
      valor: >-
        GOVERNADO, com default de FONTE PUBLICADA: ausência de ordem significa
        escala 1 — e isto NÃO é coerção a zero, porque a ausência de ordem é um
        estado clínico real (nenhuma decisão de escala 2 foi tomada).
        Atribuições contraditórias simultâneas não revogadas → parâmetro SpO2
        `invalid`. O que NUNCA pode selecionar escala 2: estado de O2
