  - id: SOFA-09
    regra: RULE-SOFA 0.2.0
    classe_do_insumo: administração de medicamento
    origem_na_spec: "TABELADO — spec §3.1 linha 9"
    pathway_and_version: {valor: "RULE-SOFA 0.2.0 — componente cardiovascular", status: declarado_na_spec, nota: N-SPEC-WORKING-TREE}
    input_concept: {valor: "Taxa de dose do agente vasoativo, com histórico temporal suficiente para provar duração sustentada e detectar início recente", status: declarado_na_spec}
    mandatory_or_optional:
      valor: >-
        CONDICIONAL, com comportamento de ausência DECIDIDO: agente tabelado
        presente com dose ausente ou não utilizável → o componente NÃO fica
        `not_evaluated`; ele assume o piso que a presença do agente garante, com
        marcação obrigatória ("dose ausente — piso por presença do agente"). O
        piso nunca rebaixa um escore baseado em dose disponível. Valor de dose
        em janela fora de faixa plausível ou em conflito não reconciliado
        continua envenenando o componente (`invalid`).
      status: declarado_na_spec
    clinical_code_or_value_set: {valor: null, status: nao_declarado_na_spec, nota: N-TERMINOLOGIA, detalhe: "A spec registra \"(atributo de administração)\" — não há código clínico próprio; o vínculo depende do recurso de administração que não existe."}
    expected_unit_and_conversion_policy:
      valor: >-
        Unidade canônica UCUM `ug/kg/min`. Conversão a partir de µg/min ou mL/h
        EXIGE peso corporal (SOFA-10) e concentração da solução (SOFA-D7, não
        tabelada); a política de conversão é declarada VALIDATION REQUIRED pela
        própria spec. Faixas plausíveis declaradas por agente (dopamina
        0,5-60; dobutamina 0,5-40; adrenalina/noradrenalina 0,01-5).
      status: declarado_na_spec
    patient_encounter_tenant_scope: {valor: "Por paciente e encontro, escopado por tenant.", status: exigido_pelo_7_2, nota: N-IDENTIDADE}
    source_system_and_authoritative_amh_contract: {valor: null, status: sem_fonte_evidenciada, nota: N-MEDADMIN}
