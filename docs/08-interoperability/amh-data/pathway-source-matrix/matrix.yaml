# =============================================================================
# VOCABULÁRIOS CONTROLADOS
# =============================================================================

vocabulario_de_elegibilidade:
  inelegivel_hoje: >-
    PROMPT §7.2 — a falta de fonte autoritativa, código, unidade, vínculo
    paciente/encontro, timestamp, política de frescor, comportamento de
    correção OU medição de povoamento representativa torna o insumo inelegível
    para avaliação acionável. Todas as 47 linhas faltam VÁRIOS desses, não um.
  elegivel_para_avaliacao_acionavel: >-
    NÃO USADO. Nenhuma linha qualifica. Exigiria todos os itens de PROMPT §7.2
    satisfeitos COM evidência medida (camadas 2-4), não declarada.
  elegivel_para_avaliacao_sombra_nao_acionante: >-
    NÃO USADO. Avaliação em sombra exige autorização de privacidade, segurança
    e pesquisa/governança (nenhuma existe — OS-16 pendente) E uma fonte povoada
    (que também não existe). A ausência de fonte não é contornável por sombra.

vocabulario_de_status_de_campo:
  declarado_na_spec: >-
    Valor transcrito da especificação da regra (lado regra). Autoritativo para
    o que a REGRA exige; não afirma nada sobre a fonte.
  candidato_na_spec_sem_pin: >-
    A spec declara o vínculo terminológico como CANDIDATO (PROPOSAL). Nenhum
    value set, expansão ou release foi pinado. Autoridade de mapeamento
    pendente (ADR-0029).
  nao_declarado_na_spec: >-
    A lógica decidida da regra exige este dado, mas a tabela de insumos da spec
    não o enumera nem lhe atribui código/unidade/janela. É AMBIGUIDADE DA SPEC,
    transcrita como lacuna e deliberadamente NÃO resolvida aqui.
  exigido_pelo_7_2: >-
    Requisito do próprio §7.2, não um valor observado.
  declarado_camada_1_apenas: >-
    Existe contrato AMH declarado (camada 1). Camadas 2, 3 e 4 sem evidência.
    "Profile existe" não é povoamento.
  excluido_estruturalmente: >-
    O único profile de Observation da IG fixa `category` em `laboratory` por
    `patternCodeableConcept` sem `slicing`; instância conforme não pode
    carregar outra categoria.
  bloqueado_fonte_vazia: >-
    Contrato declarado existe, mas a fonte está documentada como vazia/não
    ingerida.
  sem_fonte_evidenciada: >-
    Nenhum profile, tabela, evento, API ou fonte nomeada foi inventariado para
    este insumo em nenhuma camada. Ausência, não negativa conhecida.
  VALIDATION_REQUIRED: >-
    Exige humano nomeado, ambiente ou estudo empírico antes de ser confiável.

motivos_de_inelegibilidade:
  M-01_EXCLUSAO_ESTRUTURAL_NAO_LABORATORIAL: >-
    O `patternCodeableConcept` fixado em `laboratory`, sem `slicing`, no único
    profile de Observation da IG exclui TODA categoria não-laboratorial do
    vocabulário HL7 `observation-category` — `vital-signs`, `survey`, `exam`,
    `imaging`, `procedure`, `therapy`, `activity`, `social-history`. É exclusão
    ESTRUTURAL, não lacuna de cobertura: sinais vitais e avaliações de
    beira-leito exigem profile PRÓPRIO, autorado, publicado, versionado E
    povoado. FONTE (dossiê V2): compatibility-finding.md §3.2;
    contracts.lock.draft.yaml fhir_package.observation_profiles
    (`vital_signs_capable: false`); vital-signs-decision §2.2 e §2.3.
  M-02_OBSERVATION_LABORATORIAL_BLOQUEADA_FONTE_VAZIA: >-
    AMH ADR-040 registra `Observation` como bloqueado até os resultados de exame
    serem ingeridos no Bronze; o bloqueio é por falta de dado, não por código; a
    tabela Bronze PACIENTE_EXAME existe no catálogo com 0 linhas; a fonte
    estruturada Diagnose/LIS não é ingerida. FONTE (dossiê V2):
    compatibility-finding.md §3.1; contracts.lock.draft.yaml verified_files
    claim_ref 6.
  M-03_CAMINHO_DE_DESBLOQUEIO_NAO_CONFORME_IMPLEMENTADO: >-
    Contradição C-4. O caminho de desbloqueio emite
    `Observation.code = {text: "Resultado de exame"}` e `valueString`, enquanto
    o profile vincula `code` ao ValueSet `amh-loinc-laboratory` e fixa
    `valueQuantity.system` em UCUM. Texto livre mais payload string não é
    quantidade LOINC-codificada em UCUM. Agravante registrado em 2026-08-15:
    esse caminho NÃO é um plano — está IMPLEMENTADO no produtor de registro
    (vital-signs-decision §2.4, evidência E-5). Nenhuma regra de limiar consome
    um `valueString`. Reservado aos donos AMH (OS-20).
  M-04_SEM_CONTRATO_INVENTARIADO: >-
    Nenhum contrato, profile, tabela, evento ou API de qualquer tipo foi
    inventariado para esta classe de insumo no commit pinado. Não é bloqueio —
    é ausência. Distinguir de M-01/M-02, que são negativas conhecidas.
  M-05_SEM_PROFILE_MEDICATIONADMINISTRATION: >-
    Não há profile `MedicationAdministration` entre os 21 JSON de nível superior
    de `schemas/fhir-profiles/@0a07a6f1`. Existem `Medication`,
    `MedicationRequest` e `MedicationDispense` — prescrição e dispensação NÃO
    são administração titulada, e nenhuma delas carrega taxa de dose no tempo.
    Esta classe (classe D em impacto-no-portfolio.md §1) NÃO TEM ORDEM DE
    SERVIÇO, nem pergunta aberta, nem item de caminho crítico associado. Tem a
    mesma forma de C-1 e ninguém a nomeou como decisão.
  M-06_SEM_LATENCIA_MEDIDA_CANAL_EM_LOTE: >-
    Frescor ponta a ponta é inteiramente não medido. Toda cifra de latência no
    repositório AMH é meta de documento em rascunho ou throughput de escrita em
    lote da própria AMH no HAPI — nenhuma é medição de caminho de LEITURA de
    consumidor. ADR-040 declara que o canal FHIR não é near-real-time enquanto
    o CDC estiver parqueado. FONTE (dossiê V2): compatibility-finding.md §4.3;
    four-layer-dossier.md camada 4.
  M-07_SEM_MEDICAO_DE_POVOAMENTO: >-
    Camada 3 = SEM_EVIDENCIA_OBSERVADA; camada 4 = SEM_EVIDENCIA. As alegações
    de povoamento da AMH (11.451.908 recursos FHIR em 7/8 tipos, sem enumerar
    quais oito) são alegações SOURCE pendentes de verificação em ambiente — não
    são observações, e não são decompostas por tipo de recurso nem por tenant.
  M-08_SEM_AMBIENTE_SEMELHANTE_A_PRODUCAO: >-
    Somente `dev` está provisionado; `stg`, `prod` e `dr` não existem. O Gate G3
    exige testes de conformidade em ambiente semelhante a produção — condição
    hoje impossível para QUALQUER pessoa em QUALQUER nível de acesso.
  M-09_SEM_PIN_DE_TERMINOLOGIA: >-
    Nenhum servidor de terminologia, expansão ou versão de release foi
    verificado; LOINC e UCUM estão não pinados
    (`terminology_versions_pinned: false`). Os vínculos das specs são
    CANDIDATOS declarados pelas próprias specs; a autoridade de mapeamento é do
    arquiteto de terminologia sob o processo do ADR-0029. Nenhum código desta
    matriz é um pin.
  M-10_SEM_SEMANTICA_DE_DUPLICATA_ORDEM_CORRECAO_CANCELAMENTO: >-
    Comportamento de duplicata, ordenação, correção, cancelamento, merge/unmerge,
    deleção, alta, óbito e backfill é indefinido para TODO insumo. PROMPT §7.1 e
    §7.2 o exigem. `replay_backfill_correction_guarantees` e
    `reconciliation_procedure` são `null` em contracts.lock.draft.yaml. O
    ADR-0005 (modelo canônico de observação/proveniência/qualidade/correção/
    tempo) está `proposed`.
  M-11_IDENTIDADE_E_TENANT_DECIDIDOS_MAS_SEM_ARTEFATO: >-
    A adjudicação AQ-1..AQ-6 foi DECIDIDA pelo titular em 2026-08-15 (direção),
    mas nenhuma resolução criou arquivo, publicou package, provisionou ambiente
    ou mediu uma linha de dado. O identificador de fronteira decidido
    (`portable_subject_ref`, formato `amh:psr:v1:<uuidv4>`) e o IG alvo 1.1.0
    NÃO EXISTEM como artefatos; a V2 não pode pinar o que não existe. Além
    disso, `Observation.encounter` é OPCIONAL no único profile declarado — o
    vínculo de encontro que o §7.2 exige não é garantido pelo contrato.
  M-12_SEM_FONTE_CLINICA_CONCEITUAL: >-
    O insumo é um juízo clínico, um ato de beira-leito, uma ordem ou uma
    anotação de contexto de cuidado, e NENHUMA evidência identifica sistema,
    formulário, campo ou fluxo de captura de onde ele viria — nem na AMH nem na
    V2. Não basta um profile: é preciso existir o ato de registro.
  M-13_JANELA_RATIFICADA_NO_LADO_REGRA_SEM_POLITICA_DE_FRESCOR_DA_FONTE: >-
    ATUALIZAÇÃO DE 2026-08-15 — substitui, para estas três regras, o antigo
    "não existe política de frescor". As janelas e expirações POR INSUMO foram
    ratificadas pelo revisor nomeado (GDEC-0007), quitando VAL-0023 para SOFA,
    NEWS2 e GCS. A lacuna MIGROU: continua sem existir (a) política de frescor
    do lado da FONTE, (b) SLO de frescor no contrato
    (`freshness_slo: null`), e (c) qualquer percentil de latência medido. Uma
    janela de 1 h contra um canal em lote é conformidade que produz
    `stale`/`not_evaluated` na maioria das leituras — e isto é camada 4, não
    medida.
  M-14_AMBIGUIDADE_DA_SPEC_INSUMO_NAO_TABELADO: >-
    A lógica decidida da regra exige este dado (flag obrigatória, gate,
    supressão ou conversão), mas a tabela de insumos da spec não o enumera nem
    lhe atribui código, unidade, janela de frescor ou comportamento de ausência.
    Transcrito aqui como lacuna, NÃO resolvido — resolvê-lo é ato do autor da
    spec e do revisor clínico nomeado, não deste especialista.

