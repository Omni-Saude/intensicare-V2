notas_comuns:
  N-TEMPOS: >-
    Nenhuma semântica de tempo acordada para consumo: não há definição de tempo
    clínico observado × emitido × recebido × disponível, fuso, precisão,
    clock-skew, chegada tardia ou ordenação para nenhuma interface que a V2
    consumiria. Registrado como lacuna de camada 1 em four-layer-dossier.md
    ("Reconnaissance is incomplete against the full §7.1 checklist"). As regras,
    por sua vez, exigem explicitamente que staleness seja computada do TEMPO
    CLÍNICO DA FONTE contra o relógio de avaliação na leitura, nunca do tempo de
    recepção nem da ordem de linha — exigência que nenhum contrato AMH hoje
    satisfaz nem contradiz, porque não trata do assunto.
  N-FRESCOR: >-
    A janela do lado regra é ratificada (GDEC-0007). Do lado da fonte não existe
    política de frescor, não existe `freshness_slo` no contrato (null) e não
    existe nenhum percentil de latência medido em caminho de leitura de
    consumidor. ADR-040: o canal FHIR não é near-real-time enquanto o CDC
    estiver parqueado.
  N-COBERTURA: >-
    Nenhum tenant designado para a V2 — o nome do tenant piloto foi
    explicitamente adiado para a redação do contrato (AQ-6, item 4). A
    enumeração autoritativa decidida é o conjunto pós-ADR-041 (12 tenants de
    negócio), e o CodeSystem/ValueSet `amh-tenant` e a tabela de partições do
    HAPI estão DEFASADOS, a corrigir no IG 1.1.0 (não publicado). Apenas 2 dos
    12 tenants estão documentados com partições HAPI pré-criadas. Nenhuma
    cobertura por tenant ou facility foi medida para insumo algum.
  N-POVOAMENTO: >-
    Camada 3 sem evidência observada. Nenhuma contagem de linhas/recursos,
    nenhuma distribuição de nulos, nenhuma taxa de conformidade de código ou
    unidade foi medida para nenhum insumo. A negativa documentada mais próxima é
    a favor da inelegibilidade, não contra: PACIENTE_EXAME com 0 linhas, e
    52.452 linhas clínicas referenciando encontros ausentes por desvio de
    ingestão (HAZ-0038) — a completude referencial é sabidamente imperfeita e
    não medida para os fins da V2.
  N-PROVENIENCIA: >-
    Somente camada 1. Não existe contrato de linhagem/proveniência para consumo.
    O CodeSystem `amh-data-quality-status` (`valid | warning | quarantined`,
    content complete) existe e é escopado à coluna `_dq_status` do Silver-Rules;
    é VALIDATION REQUIRED se esse status é sequer carregado nos recursos
    servidos pelo HAPI — se não for, o consumidor FHIR da V2 não recebe NENHUM
    sinal de qualidade de fonte. Regra vinculante: a dimensão de qualidade de
    fonte da AMH (`valid`) e a dimensão de status de avaliação da V2 (`valid`)
    são ORTOGONAIS e nunca podem ser conflacionadas; `quarantined` nunca pode
    aparecer como valor normal na V2.
  N-CORRECAO: >-
    Indefinido para todo insumo: duplicata, ordenação, correção, cancelamento,
    merge/unmerge, deleção, alta, óbito, backfill e consequências de replay.
    Nenhum contrato define; `replay_backfill_correction_guarantees` e
    `reconciliation_procedure` são null. As regras, por sua vez, JÁ definem
    comportamento de conflito por insumo (conflito simultâneo não reconciliado →
    `invalid`), o que só é executável contra uma semântica de fonte que não
    existe.
  N-CONFORMIDADE: >-
    NENHUMA evidência de conformidade. Nenhum teste foi executado contra nenhum
    ambiente AMH (`measured_compatibility_results: null`); não há fixtures
    (`fixtures: []`); não há registro de aprovação (`approval_records: []`);
    não há pacote de contrato AMH×IntensiCare (o caminho
    `schemas/contracts/intensicare/` não existe — verificado por enumeração da
    árvore completa, 3.685 entradas).
  N-AMBIENTE: >-
    Somente `dev` provisionado. `stg`, `prod` e `dr` não existem e não têm
    tfstate. Nenhuma verificação de camada 2, 3 ou 4 é possível em ambiente
    semelhante a produção, por ninguém, hoje.
  N-IDENTIDADE: >-
    Direção decidida (AQ-1..AQ-6, 2026-08-15): `identifier:mpiId` é o elemento
    autoritativo no fio; tenant deriva da partição de URL mais claim do token
    (nunca de header escolhido pelo cliente); o `portable_subject_ref`
    (`amh:psr:v1:<uuidv4>`) é o identificador de fronteira OBRIGATÓRIO do
    contrato v1; a chave de fato clínico na V2 é o par (PSR, encontro); nenhum
    bypass cross-tenant existirá. NADA DISSO EXISTE AINDA COMO ARTEFATO: o IG
    1.1.0 não foi publicado, os DDLs de PSR não foram aplicados (OS-11, portão
    DPO/Jurídico OS-16), não há backfill de minting (OS-15) e a V2 não tem
    contrato pinável. Além disso, `Observation.encounter` é OPCIONAL no único
    profile declarado — o vínculo de encontro exigido pelo §7.2 não é garantido
    pelo contrato mesmo quando houver dado.
  N-TERMINOLOGIA: >-
    O código transcrito é CANDIDATO declarado pela própria spec da regra; não é
    pin, não é decisão de mapeamento e não foi validado contra servidor de
    terminologia algum. LOINC e UCUM não têm release pinado. O único ValueSet
    AMH referenciado é `amh-loinc-laboratory`, com binding `extensible`, ligado
    ao profile laboratorial. A autoridade de mapeamento e a validação pt-BR
    correspondente correm sob ADR-0029; a decisão de mapeamento é PROIBIDA a
    este especialista.
  N-EXCLUSAO-ESTRUTURAL: >-
    Ver motivo M-01. Enquanto o profile não for corrigido (emenda com `slicing`
    ou profile novo — questão QD-6, não decidida) e uma fonte estruturada não
    for identificada, ingerida, mapeada e MEDIDA, não existe caminho conforme
    para este insumo. A face D-c da decisão C-1 (escopo "sinais vitais" ×
    "toda Observation não-laboratorial") determina se este insumo é sequer
    alcançado pela decisão.
  N-LAB-BLOQUEADO: >-
    Ver motivos M-02 e M-03. O profile laboratorial existe e é conforme; a fonte
    está vazia e o caminho de desbloqueio implementado é não conforme. OS-20
    encaminha o caminho estruturado Diagnose/LIS e não tem data.
  N-MEDADMIN: >-
    Ver motivo M-05. Classe D de impacto-no-portfolio.md §1: bloqueia SOFA-CV,
    sedação, delirium, antimicrobiano e profilaxia, e não tem ordem de serviço,
    pergunta aberta nem item de caminho crítico. Precisa da mesma sessão de
    decisão que C-1.
  N-BEIRA-LEITO: >-
    Avaliações de beira-leito (GCS E/V/M, RASS, ACVPU, escalas) e registro de
    enfermagem (diurese) cairiam tipicamente em `survey`/`exam` no FHIR e estão
    excluídas pelo MESMO `pattern` `laboratory` (M-01). Além da exclusão
    estrutural, há uma segunda camada de ausência: nenhum sistema, formulário ou
    campo de captura foi identificado (M-12) — corrigir o profile não cria o ato
    de registro.
  N-SPEC-WORKING-TREE: >-
    Transcrito de especificação em working tree NÃO COMMITADO (0.2.0 em revisão
    por sessão concorrente). Sujeito a divergência; re-verificar antes de uso.
  N-DERIVADO: >-
    Insumo NÃO TABELADO na tabela de insumos da spec, porém exigido pela lógica
    decidida da própria spec. Registrado como ambiguidade (M-14) e
    deliberadamente não resolvido aqui.

# =============================================================================
