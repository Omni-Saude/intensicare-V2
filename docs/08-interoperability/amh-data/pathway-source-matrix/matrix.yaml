# =============================================================================
# IntensiCare V2 — MATRIZ VIA-INSUMO-FONTE (§7.2) para os três precursores de regra
#
#   doc_id:  AMH-PATHWAY-SOURCE-MATRIX-RULES
#   status:  PROPOSAL — NÃO ACEITO. Nenhuma linha é decisão.
#   label:   PROPOSAL
#   escopo:  RULE-SOFA 0.2.0, RULE-NEWS2 0.2.0, RULE-GCS 0.2.0
#   idioma:  pt-BR (DEC-G0-10)
#
# LEIA ANTES DE USAR QUALQUER LINHA
# ---------------------------------------------------------------------------
# 1. O RESULTADO, SEM SUAVIZAÇÃO. São 47 linhas. Insumos com fonte evidenciada
#    (semântica + código + unidade + vínculo paciente/encontro + timestamp +
#    política de frescor da fonte + comportamento de correção + medição de
#    povoamento representativa, PROMPT §7.2): ZERO. Toda linha resolve para
#    `eligibility_decision: inelegivel_hoje`.
#
# 2. NENHUM CÓDIGO, UNIDADE, LATÊNCIA OU COBERTURA FOI INVENTADO. Todo código
#    LOINC/ATC e toda unidade UCUM desta matriz é transcrição literal do que a
#    PRÓPRIA especificação da regra declara, e as especificações declaram esses
#    vínculos como CANDIDATOS (PROPOSAL). A autoridade de mapeamento
#    terminológico é PENDENTE (ADR-0029 — processo de validação de terminologia
#    clínica; nenhum value set, servidor de terminologia ou release LOINC/UCUM
#    foi pinado: `contracts.lock.draft.yaml` terminology_versions_pinned: false).
#    Onde não há evidência, o valor é literalmente `null` com `status`.
#
# 3. AS SPECS ESTÃO EM WORKING TREE NÃO COMMITADO. As três especificações 0.2.0
#    estão em revisão por sessão concorrente. Toda citação a elas é
#    "estado de working tree não commitado (0.2.0 em revisão)" e pode divergir
#    do que for eventualmente commitado. Re-verificar antes de qualquer uso.
#
# 4. "PROFILE EXISTE" / "HTTP 200" NÃO É POVOAMENTO (PROMPT §7.2). Linhas cuja
#    fonte é um profile AMH declarado continuam INELEGÍVEIS: contrato declarado
#    é evidência de camada 1; as camadas 2, 3 e 4 não têm evidência alguma.
#
# 5. NENHUM LIMIAR, BANDA, PONTO DE CORTE OU PESO CLÍNICO APARECE AQUI. Faixas
#    de plausibilidade e janelas de frescor aparecem porque são política de
#    insumo (§7.2 exige unidade e frescor); bandas de escore não aparecem.
#
# 6. SEM PHI, SEM CREDENCIAIS, SEM CPF, SEM IDENTIFICADOR REAL DE PACIENTE.
#
# 7. ESTA MATRIZ NÃO ADMITE NADA A PORTFÓLIO, não decide mapeamento
#    terminológico, não cria DECIDED e não edita rule-releases, inventário,
#    portões ou registros.
# =============================================================================

