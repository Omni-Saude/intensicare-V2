    resource_table_event_and_field_path: {valor: null, status: sem_fonte_evidenciada, nota: N-MEDADMIN}
    times_source_observed_issued_received_available:
      valor: null
      status: sem_fonte_evidenciada
      nota: N-TEMPOS
      detalhe: >-
        Exigência temporal específica e não satisfeita por nenhum contrato: a
        regra precisa do INSTANTE DE INÍCIO e do HISTÓRICO DE TAXA da
        administração para (a) provar taxa qualificante sustentada por ao menos
        60 min e (b) identificar a primeira hora de uma infusão nova, que ativa
        um tier provisório marcado. Um registro sem linha do tempo de taxa não
        serve.
    freshness_window_and_measured_latency_percentiles:
      valor: >-
        Janela do lado regra RATIFICADA: ativa em T; taxa sustentada por ao
        menos 60 min; última confirmação de taxa em até 2 h; expiração 4 h.
        Percentis medidos: nenhum. É a exigência de frescor mais incompatível
        com um canal em lote em toda a matriz do SOFA.
      status: VALIDATION_REQUIRED
      nota: N-FRESCOR
    tenant_facility_coverage: {valor: null, status: sem_fonte_evidenciada, nota: N-COBERTURA}
    population_and_null_invalid_distributions: {valor: null, status: sem_fonte_evidenciada, nota: N-POVOAMENTO}
    provenance: {valor: null, status: sem_fonte_evidenciada, nota: N-PROVENIENCIA}
    duplicate_order_correction_cancellation_semantics: {valor: null, status: sem_fonte_evidenciada, nota: N-CORRECAO}
    confidence: {valor: "baixa quanto à fonte; alta quanto à transcrição da spec", status: declarado_na_spec}
    owner: {valor: "UNASSIGNED — VALIDATION REQUIRED", status: VALIDATION_REQUIRED}
    conformance_evidence: {valor: null, status: sem_fonte_evidenciada, nota: N-CONFORMIDADE}
    unresolved_gap: >-
      Três lacunas empilhadas: sem recurso de administração (M-05); sem política
      de conversão de dose ratificada (a própria spec a declara VALIDATION
      REQUIRED); e sem contrato temporal capaz de sustentar "taxa sustentada por
      1 h" e "primeira hora de infusão nova".
    eligibility_decision: inelegivel_hoje
    motivos: [M-05_SEM_PROFILE_MEDICATIONADMINISTRATION, M-04_SEM_CONTRATO_INVENTARIADO, M-06_SEM_LATENCIA_MEDIDA_CANAL_EM_LOTE, M-07_SEM_MEDICAO_DE_POVOAMENTO, M-08_SEM_AMBIENTE_SEMELHANTE_A_PRODUCAO, M-09_SEM_PIN_DE_TERMINOLOGIA, M-10_SEM_SEMANTICA_DE_DUPLICATA_ORDEM_CORRECAO_CANCELAMENTO, M-13_JANELA_RATIFICADA_NO_LADO_REGRA_SEM_POLITICA_DE_FRESCOR_DA_FONTE]

