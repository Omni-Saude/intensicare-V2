    efeito: >-
      A V2 opera sob a ata, que e registro fiel do que foi transmitido. Ambas as
      pendencias devem estar fechadas antes do G3.
  registration_gap_status: VALIDATION_REQUIRED

  resolutions:
    AQ-1:
      resolucao: C
      sintese: >-
        MPI por tenant (ADR-041 §6) + indice de correspondencia cross-PJ
        separado e governado (ADR-043). ADR-006 fica superado. A linguagem
        "longitudinal cross-tenant" da IG e defeito de documentacao.
      ordens: [OS-02, OS-06]
    AQ-2:
      resolucao: B
      sintese: >-
        identifier:mpiId e autoritativo; extensions rebaixadas de 1..1. URL de
        profile unica = fhir.americashealth.com.br; amh.health/BR* e defeito do
        produtor. IG package 1.1.0 a publicar e pinar.
      ordens: [OS-01, OS-05, OS-07, OS-08]
    AQ-3:
      resolucao: C
      sintese: >-
        Base legal do loop clinico = tutela da saude (LGPD Art. 11, II, "f").
        Sem gate de consentimento no loop clinico. Usos secundarios bloqueados.
        ie_perm_sms_email jamais como consentimento. Ratificacao juridica antes
        de dado real.
      ordens: [OS-13, OS-16, OS-21]
    AQ-4:
      resolucao: A plena
      sintese: >-
        portable_subject_ref obrigatorio como identificador de fronteira do
        contrato v1. PSR nativo na V2 desde o dia um, sintetico em dev.
        SP-1..SP-7 viram itens de trabalho ordenados. Ref independente de
        encontro, sempre qualificada por encontro.
      ordens: [OS-10, OS-11, OS-12, OS-13, OS-14, OS-15, OS-16]
    AQ-5:
      resolucao: A vinculante
      sintese: >-
        Eventos de ciclo de vida de identidade + resolve(ref, as_of)
        obrigatorios no contrato v1. Sem eles o G3 NAO passa.
      ordens: [OS-17, OS-18]
    AQ-6:
      resolucao: A
      sintese: >-
        Bypass cross_tenant_authorized = deriva documental, nao existira.
        Enumeracao autoritativa = 12 tenants pos-ADR-041. CodeSystem/ValueSet e
        particoes HAPI a corrigir.
      ordens: [OS-03, OS-04, OS-09]

  # -------------------------------------------------------------------------
  # PINS QUE PASSARAO A EXISTIR — ALVOS, NAO PINS
  # Nenhum destes artefatos existe hoje. Cada entrada e um alvo declarado para
  # que a V2 saiba o que pinar quando existir, e para que a ausencia seja
  # legivel em vez de silenciosa.
  # -------------------------------------------------------------------------
  pins_a_existir:

    fhir_package_1_1_0:
      package_id: br.com.americashealth.fhir
      package_version_alvo: 1.1.0
      substitui: 1.0.0            # a versao OBSERVADA no commit pinado
