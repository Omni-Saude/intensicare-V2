          e extension:tenantId rebaixadas de 1..1 para 0..1 em Patient-amh e
          Observation-amh-laboratory
        - OS-02 — remocao da linguagem de MPI longitudinal cross-tenant
        - OS-03 — CodeSystem/ValueSet amh-tenant corrigido para 12 tenants
          pos-ADR-041 (sem austa_clinicas, sem amh_landing)
        - OS-04 — remocao do texto do bypass cross_tenant_authorized
      compatibilidade_declarada_alvo: >-
        MISTA e precisa ser dita, nao descoberta: rebaixar 1..1 -> 0..1 afrouxa
        (compativel para tras); elevar identifier:mpiId 0..1 -> 1..1 APERTA e e
        INCOMPATIVEL para tras para qualquer produtor que hoje omita o
        identifier.
      digest: null
      pinned: false
      status: NAO_PUBLICADO — depende de OS-05
      bloqueia: >-
        Enquanto nao existir, fhir_package.package_digest permanece null e este
        lock nao sai de DRAFT.

    portable_subject_ref:
      formato_alvo: amh:psr:v1
      papel_no_contrato: >-
        Campo sujeito do contrato AMH×IntensiCare v1 — OBRIGATORIO (AQ-4).
      escopo: "{amh_tenant, legal_entity}"
      qualificacao_de_encontro: >-
        Independente de encontro, sempre qualificada por encontro (decidido em
        AQ-4; responde a sub-questao factual levantada na adjudicacao).
      nativo_na_v2: true          # desde o dia um, sintetico em dev
      exemplo_de_forma: null      # nenhuma ref mintada existe; nao inventar
      pinned: false
      status: NAO_EXISTE — depende da ONDA C (OS-10..OS-16)
      dependencia_externa: OS-16 — parecer DPO/juridico (unica externa)

    contrato_intensicare_v1:
      caminho_proposto: schemas/contracts/intensicare/v1/contract-manifest.yaml
      propriedade: AMH-owned — a V2 propoe, nao coloca (XRD-04)
      clausulas_decididas:
        campo_sujeito: portable_subject_ref (AQ-4)
        ciclo_de_vida_de_identidade: >-
          Eventos (alias, merge, unmerge/split, restore, reassignment, erasure)
          + resolve(ref, as_of) — OBRIGATORIOS (AQ-5). Condicao declarada de
          passagem do G3.
        modelo_de_finalidade: >-
          Tutela da saude, LGPD Art. 11, II, "f", no loop clinico. Sem gate de
          consentimento. Usos secundarios bloqueados (AQ-3).
        exclusoes_explicitas_minimas:
          - sinais vitais — nenhum profile; category fixada em laboratory
          - Observation laboratorial — enquanto OS-20 nao concluir pelo caminho
            estruturado Diagnose/LIS
      digest: null
      pinned: false
      status: NAO_EXISTE — depende de OS-19

  # -------------------------------------------------------------------------
  # O QUE AS RESOLUCOES NAO DECIDIRAM
  # Registrado para que a ausencia nao seja lida como afirmacao.
  # -------------------------------------------------------------------------
  nao_decidido:
    C-1_sinais_vitais: >-
      As seis resolucoes NAO decidem a contradicao dos sinais vitais. O unico
      profile de Observation da IG fixa category em laboratory por padrao,
      excluindo estruturalmente sinais vitais de qualquer instancia conforme.
      Exigiria novo profile e nova decisao de produto. Permanece a Q1 do
      dossie — a pergunta de maior valor.
    C-2_autenticacao_implantada: >-
      AQ-6 elimina o bypass cross_tenant_authorized, mas o mecanismo de
      autenticacao efetivamente implantado por ambiente permanece aberto (Q2).
      Exige descoberta empirica, nao decisao.
    ambientes: >-
      Apenas dev provisionado. Nenhuma resolucao cria ambiente. A condicao de
      ambiente similar a producao do G3 continua insatisfazivel por qualquer
      parte (Q6).
    transporte: >-
      Nenhuma resolucao escolheu transporte. §7.5 continua exigindo comparacao
      entre FHIR REST/Subscriptions, stream de eventos, batch controlado e
      outras opcoes.
    camada_4: >-
      Nenhuma resolucao mede latencia, completude, ordenacao, disponibilidade,
      replay ou recuperacao. Camada 4 permanece sem evidencia.

  efeito_no_achado_de_compatibilidade: >-
    O achado NAO muda para "compativel". Permanece: candidato a integracao;
    compatibilidade nao demonstrada para avaliacao de UTI acionavel. O que
    mudou e a natureza do bloqueio — de INDEFINICAO para EXECUCAO E AMBIENTE,
    que e um estado melhor e mensuravel.

