# =============================================================================
# AGGREGATE FINDINGS
# =============================================================================
findings:
  headline: >-
    All 25 rows are INELIGIBLE_FOR_ACTIONABLE_EVALUATION. Zero inputs across
    zero candidates are eligible at the pinned AMH evidence snapshot.

  by_reason_code:
    # Count of rows listing each code in `eligibility_reasons` as an
    # INDEPENDENT, DECISIVE ground for ineligibility. Verified by parsing this
    # file (2026-08-14); do not hand-edit without re-counting.
    R1_VITALS_STRUCTURALLY_EXCLUDED: 12
    R2_LAB_OBSERVATION_BLOCKED_EMPTY_SOURCE: 4
    R3_UNBLOCKING_PLAN_NONCONFORMANT: 4
    R4_NO_CONTRACT_IDENTIFIED: 9
    R5_NO_FRESHNESS_POLICY: 21
    R6_NO_MEASURED_LATENCY: 1
    R7_NO_POPULATION_MEASUREMENT: 20
    R8_IDENTITY_TENANCY_UNRESOLVED: 3
    R9_NO_TERMINOLOGY_PIN: 17
    R10_NO_CORRECTION_SEMANTICS: 9
    R11_NO_ENVIRONMENT: 3
    R12_NO_CLINICAL_SOURCE_CONCEPT: 6
    note: >-
      Counts sum to more than 25 - most rows fail for several independent
      reasons. That redundancy is the finding - no single AMH fix makes any row
      eligible.
    counting_rule: >-
      R5, R6, R7 and R10 are recorded in the corresponding per-row FIELD for
      every row (no row anywhere carries a defined freshness window, a measured
      latency percentile, a population measurement, or defined correction
      semantics), but are listed under `eligibility_reasons` only where they are
      an INDEPENDENT ground. For a row whose source does not exist at all, "no
      measured latency" is entailed by the absence of a source rather than an
      additional reason, and counting it twice would overstate the evidence.
      Read the per-row fields, not only these counts.

  structural_observations:
    - id: F-1
      statement: >-
        No row fails for exactly one reason. The median row cites four to six
        independent ineligibility reasons. INFERENCE - unblocking AMH Observation
        would be necessary but nowhere near sufficient; freshness policy (R5),
        correction semantics (R10), terminology pinning (R9) and population
        measurement (R7) are V2-side or joint obligations that no AMH act closes.
    - id: F-2
      statement: >-
        NO ROW in this matrix carries a defined freshness window (R5) or defined
        duplicate/order/correction/cancellation semantics (R10) - 25 of 25, on
        the per-row fields. Both are policy obligations largely within this
        programme's control (R5 is OPEN as VAL-0023). INFERENCE - they are the
        largest body of eligibility work that is NOT blocked on an AMH-owner act,
        and they can begin as soon as AUTH-CLINSAFETY is named.
    - id: F-3
      statement: >-
        The two context rows CTX-01 and CTX-02 rest on DECLARED AMH profiles
        (Patient, Encounter) rather than on absent ones. They are the only rows
        whose ineligibility is about unmeasured population and unresolved identity
        rather than about a structurally missing contract. INFERENCE - if any part
        of this matrix becomes eligible first, it will be these.
    - id: F-4
      statement: >-
        Eleven rows fail on R1 - a constraint that cannot be closed by
        configuration, mapping, or negotiation, only by AMH authoring, publishing,
        versioning and POPULATING a new vital-signs profile. compatibility-finding.md
        section 3.2 - "not a reuse, not a configuration change, not a mapping."
    - id: F-5
      statement: >-
        Six rows fail on R12 - the input is a clinical judgement or bedside
        assessment (consciousness x4, infection suspicion, supplemental-oxygen
        status) with no machine source anywhere. INFERENCE - even a complete AMH
        vital-signs and laboratory feed would leave these six unsourced. Any
        portfolio built on the assumption that "AMH will eventually supply the
        inputs" is wrong for a quarter of the matrix.

  what_this_matrix_does_not_establish:
    - "It does not select or rank any pathway. That is Gate G2 and requires ratified weights and named owners."
    - "It does not grade clinical evidence for any candidate."
    - "It does not declare AMH incompatible. compatibility-finding.md is explicit that the finding is about evidence, not about AMH's quality or trajectory."
    - "It does not resolve contradictions C-1 through C-4. They are reserved for AMH owners."
    - "It is not complete - CAND-0006 and CAND-0007 contribute no rows because they are unenumerated. Absent rows are an inventory gap, not an eligibility finding."

  re_test_obligation: >-
    PROMPT:420 makes this matrix a hard input to the portfolio optimizer. It MUST
    be re-verified at the execution commit and revised on new evidence. A stale
    eligibility matrix used to justify a portfolio is precisely the failure mode
    PROMPT:414 warns against.

