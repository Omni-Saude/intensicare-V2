# Controlled vocabulary for eligibility_decision.
eligibility_vocabulary:
  INELIGIBLE_FOR_ACTIONABLE_EVALUATION: >-
    PROMPT:415 - a missing authoritative source, code, unit, patient/encounter
    link, timestamp, freshness policy, correction behaviour, or representative
    population measurement makes the input ineligible for actionable evaluation.
  ELIGIBLE_FOR_ACTIONABLE_EVALUATION: >-
    Not used. No row qualifies. Requires all of PROMPT:415 satisfied AND
    measured, not declared, evidence at layers 2-4.
  ELIGIBLE_FOR_NON_ACTIONING_SHADOW_EVALUATION: >-
    Not used. PROMPT:349 permits shadow/non-actioning evaluation only with
    privacy, security and research/governance authorisation, none of which
    exists; and a shadow evaluation still requires a populated source, which
    also does not exist.

# Reasons, referenced by rows to keep them readable without losing specificity.
ineligibility_reason_codes:
  R1_VITALS_STRUCTURALLY_EXCLUDED: >-
    The AMH FHIR IG contains exactly one Observation profile
    (Observation-amh-laboratory) and it PATTERN-FIXES Observation.category to
    `laboratory`. A conformant instance CANNOT carry a vital-signs category.
    This is structural exclusion, not absence of coverage - vital signs would
    require a new profile to be authored, published, versioned AND populated.
    SOURCE compatibility-finding.md section 3.2; contracts.lock.draft.yaml:118-126
    (`vital_signs_capable: false`).
  R2_LAB_OBSERVATION_BLOCKED_EMPTY_SOURCE: >-
    AMH ADR-040 records Observation as `bloqueado ate os resultados de exame
    serem ingeridos no Bronze`; the block is `bloqueado por falta de dado, nao
    por codigo`; the Bronze table PACIENTE_EXAME `existe no catalogo mas veio com
    0 linhas`; the structured Diagnose/LIS source `nao e ingerido`.
    SOURCE compatibility-finding.md section 3.1.
  R3_UNBLOCKING_PLAN_NONCONFORMANT: >-
    The announced Observation construction would emit
    Observation.code = {text - "Resultado de exame"} and Observation.valueString,
    while the profile binds code to the amh-loinc-laboratory ValueSet and fixes
    valueQuantity.system to UCUM. Free text plus a string payload is not a
    LOINC-coded UCUM quantity. compatibility-finding.md section 3.1 states -
    "No ICU scoring rule - NEWS2, MEWS, SOFA, qSOFA, or any threshold logic -
    can consume a valueString." Contradiction C-4, reserved for AMH owners.
  R4_NO_CONTRACT_IDENTIFIED: >-
    No contract, profile, table, event or API of any kind has been inventoried
    for this input class at the pinned commit. Not blocked - absent. Distinguish
    from R1/R2 - those are known negatives, this is an uninventoried space.
  R5_NO_FRESHNESS_POLICY: >-
    No per-input freshness window and no invalidate-versus-degrade rule exists.
    OPEN as g1-validation-backlog.md VAL-0023 and as legacy open question
    INTENSICARE_TECHNICAL_ASSESSMENT.md:999. Required by PROMPT:415.
  R6_NO_MEASURED_LATENCY: >-
    End-to-end freshness is entirely unmeasured. Every latency figure in the AMH
    repository is either a target in a draft document or AMH's own bulk-write
    throughput into HAPI - neither is a consumer read-path measurement.
    compatibility-finding.md section 4.3. ADR-040 states the FHIR channel
    `nao e near-real-time`.
  R7_NO_POPULATION_MEASUREMENT: >-
    Evidence layer 3 (populated data) is NO_OBSERVED_EVIDENCE and layer 4
    (operational fitness) is NO_EVIDENCE. contracts.lock.draft.yaml:461-479.
    AMH's own population claims are SOURCE claims pending verification, not
    observations.
  R8_IDENTITY_TENANCY_UNRESOLVED: >-
    The ADR-006 / ADR-039 / ADR-041 / FHIR-IG conflict over longitudinal MPI
    versus tenant-local identity is unresolved and must not be silently resolved
    by V2 (PROMPT:438-447). Hazards HAZ-0001, HAZ-0002, HAZ-0027.
  R9_NO_TERMINOLOGY_PIN: >-
    No terminology server, expansion or release version verified; LOINC and UCUM
    releases unpinned; the legacy unit validator failed on three non-canonical
    `unit='anyOf:'` values. contracts.lock.draft.yaml:165-167;
    INTENSICARE_TECHNICAL_ASSESSMENT.md:459,586. Hazard HAZ-0032.
  R10_NO_CORRECTION_SEMANTICS: >-
    Duplicate, ordering, correction and cancellation behaviour is undefined for
    every input. PROMPT:378 and PROMPT:415 require it. Hazards HAZ-0008,
    HAZ-0009, HAZ-0011.
  R11_NO_ENVIRONMENT: >-
    Only `dev` is provisioned; `stg`, `prod` and `dr` do not exist and have no
    tfstate. Gate G3 requires conformance tests to pass in a production-like
    environment - a condition currently impossible for anyone at any level of
    access. compatibility-finding.md section 4.4.
  R12_NO_CLINICAL_SOURCE_CONCEPT: >-
    The input is a clinical judgement or a bedside assessment rather than a
    machine-emitted measurement, and no evidence input identifies any system,
    form, or field from which it could be obtained.

